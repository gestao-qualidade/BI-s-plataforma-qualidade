<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PierServ - Painel de Controle de Regularização de Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  :root{
    --ink:#12203A; --ink2:#3B4A66; --mute:#6B7A93; --line:#DCE2EB; --paper:#EDF0F5; --card:#fff;
    --venc:#C0304F; --pend:#3A4660; --v30:#E3A008; --v90:#8FAE2F; --ok:#0E8A7D; --sem:#A9B4C6;
    --vencBg:#FBE9ED; --pendBg:#E6E9F0; --v30Bg:#FDF3D9; --v90Bg:#EFF5DA; --okBg:#DDF1EE; --semBg:#EEF1F6;
    --navy:#0A1F6B; --royal:#1747B8; --azure:#2F6BFF;
    --num:'IBM Plex Sans Condensed','IBM Plex Sans','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',Arial,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:#1747B8;text-decoration:none} a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid #1747B8;outline-offset:2px}
  .hatch{background:repeating-linear-gradient(135deg,#3A4660 0 4px,#5A6684 4px 8px)}

  /* =========================================================
     HEADER, NAV, FILTROS E MAIN - LARGURA AUMENTADA (98%)
     ========================================================= */
  header{position:relative;color:#fff;background:linear-gradient(180deg,rgba(2,8,40,.60) 0%,rgba(2,8,40,0) 100%)}
  .hd{max-width:98%;margin:0 auto;padding:20px 12px 8px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;gap:24px;align-items:center}
  .logo{height:96px;width:auto;display:block;filter:drop-shadow(0 3px 12px rgba(0,8,50,.55))}
  .tt{padding-left:24px;border-left:1px solid rgba(255,255,255,.28)}
  h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.1px;line-height:1.15;text-shadow:0 2px 14px rgba(0,8,50,.45)}
  .sub{font-size:13px;color:#C3D3F7;margin-top:4px}
  .hr{display:flex;gap:14px;align-items:center;font-size:12px;color:#C9D7F5}
  .hr .dot{width:8px;height:8px;border-radius:50%;background:var(--sem);display:inline-block;margin-right:6px}
  .hr .live .dot{background:#4EE0C0;box-shadow:0 0 0 3px rgba(78,224,192,.25)}
  .btn{background:linear-gradient(180deg,#fff,#DDE8FD);color:var(--navy);border:0;border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px;box-shadow:0 4px 14px -6px rgba(0,8,50,.6)}
  .btn:hover{background:#fff}
  .btn.sec{background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:none;border-radius:99px} .btn.sec:hover{background:var(--semBg)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .farol{display:flex;height:5px;background:rgba(255,255,255,.18)}
  .farol i{display:block;height:100%}
  nav{max-width:98%;margin:0 auto;padding:6px 12px 14px;display:flex;gap:8px;flex-wrap:wrap}
  nav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#DCE7FC;padding:8px 18px;font-size:13px;font-weight:500;border-radius:99px;backdrop-filter:blur(4px)}
  nav button[aria-selected=true]{background:#fff;border-color:#fff;color:var(--navy);font-weight:600;box-shadow:0 6px 18px -8px rgba(0,8,50,.7)}
  nav button:hover{background:rgba(255,255,255,.18);color:#fff}
  nav button[aria-selected=true]:hover{background:#fff;color:var(--navy)}
  header :focus-visible{outline-color:#fff}

  /* filters */
  .fb{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .fbi{max-width:98%;margin:0 auto;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .fbi label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
  select,input[type=search]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;color:var(--ink);max-width:260px}
  input[type=search]{min-width:230px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--semBg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px}
  .chip button{border:0;background:transparent;width:18px;height:18px;border-radius:50%;line-height:16px;color:var(--mute)} .chip button:hover{background:var(--line)}

  main{max-width:98%;margin:0 auto;padding:18px 12px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
  .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .ct h2{margin:0;font-size:14px;font-weight:600}
  .ct span{font-size:12px;color:var(--mute)}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  /* kpis */
  .kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sem);border-radius:6px;padding:12px 14px;text-align:left;width:100%}
  button.kpi:hover{background:#F8FAFD}
  .kpi .kv{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .kpi .kl{font-size:13px;font-weight:500;margin-top:4px}
  .kpi .ks{font-size:12px;color:var(--mute)}
  .k-venc{border-left-color:var(--venc)} .k-pend{border-left-color:var(--pend)} .k-v30{border-left-color:var(--v30)} .k-ok{border-left-color:var(--ok)}
  .k-venc .kv{color:var(--venc)}

  /* galpões band */
  .band{display:grid;grid-template-columns:minmax(220px,1.1fr) repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:center;margin-bottom:14px;border-left:5px solid var(--ink)}
  .band h2{margin:0;font-size:14px;font-weight:600} .band p{margin:2px 0 0;font-size:12px;color:var(--mute)}
  .bs .n{font-family:var(--num);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .bs .t{font-size:12px;color:var(--mute)}

  /* status panel */
  .sl{display:grid;gap:6px}
  .sr{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:5px;padding:6px 6px}
  .sr:hover{background:var(--semBg)}
  .sw{width:12px;height:12px;border-radius:3px}
  .sr b{font-family:var(--num);font-size:16px;font-variant-numeric:tabular-nums}
  .sr .pc{font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
  .mb{grid-column:2/4;height:5px;background:var(--semBg);border-radius:3px;overflow:hidden;margin-top:-2px}
  .mb i{display:block;height:100%}

  /* bar list */
  .bl{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.5fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:5px;padding:5px 6px}
  .bl:hover{background:var(--semBg)}
  .bn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bt{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--semBg)}
  .bt i{display:block;height:100%}
  .bv{font-family:var(--num);font-size:14px;font-weight:700;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* tables */
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-weight:600;font-size:12px;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
  th button{background:none;border:0;font:inherit;font-weight:600;color:inherit;padding:0}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover td{background:#F8FAFD}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.nw{white-space:nowrap}
  .trunc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.clk{cursor:pointer}
  .pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
  .p-vencido{background:var(--vencBg);color:#8E1B35} .p-pendente{background:var(--pendBg);color:#2B3550}
  .p-v30{background:var(--v30Bg);color:#7A5300} .p-v90{background:var(--v90Bg);color:#4B5F10}
  .p-ok{background:var(--okBg);color:#0A5E55} .p-semdata{background:var(--semBg);color:#4B586F}
  .sc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .sc button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:500;display:flex;gap:6px;align-items:center}
  .sc button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sc button .sw{width:9px;height:9px}
  .pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--mute)}
  .pg button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px} .pg button[disabled]{opacity:.45;cursor:default}

  /* matrix */
  .mx td,.mx th{vertical-align:top}
  .mx td.c{min-width:210px}
  .cell{border-radius:5px;padding:7px 10px;border:1px solid transparent}
  .cell b{display:block;font-size:13px;font-weight:600}
  .cell small{display:block;font-size:12px;opacity:.9}
  .cell.vencido{background:var(--vencBg);border-color:#F2C2CD;color:#8E1B35}
  .cell.pendente{background:var(--pendBg);border-color:#C9CFDC;color:#2B3550}
  .cell.v30{background:var(--v30Bg);border-color:#F1DB9B;color:#7A5300}
  .cell.v90{background:var(--v90Bg);border-color:#D4E3A3;color:#4B5F10}
  .cell.ok{background:var(--okBg);border-color:#B6DDD7;color:#0A5E55}
  .cell.semdata{background:var(--semBg);border-color:var(--line);color:#4B586F}
  .cell.nd{background:#fff;border:1px dashed #B9C3D3;color:var(--mute)}

  .note{font-size:12px;color:var(--mute);margin-top:18px;max-width:100%}
  .empty{padding:34px;text-align:center;color:var(--mute)}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;display:none;z-index:20;max-width:360px}
  .err{background:var(--vencBg);border:1px solid #F2C2CD;color:#8E1B35;border-radius:6px;padding:14px 16px;margin-bottom:14px}

  /* ===== tema azul PierServ ===== */
  html{background:#0A1F6B}
  body{background:transparent}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:
    radial-gradient(1100px 520px at 88% -8%,rgba(96,155,255,.50),transparent 62%),
    radial-gradient(900px 600px at -5% 105%,rgba(40,100,240,.38),transparent 60%),
    linear-gradient(165deg,rgba(5,16,70,.78) 0%,rgba(14,48,150,.50) 52%,rgba(7,26,98,.80) 100%)}
  
  @media(max-width:1024px){
    .g6{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g21,.g11{grid-template-columns:1fr}
    .band{grid-template-columns:1fr 1fr;gap:10px}
  }
  @media(max-width:640px){
    .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
    .band{grid-template-columns:1fr}
  }
  </style>
</head>
<body>

  <header>
    <div class="hd">
      <div class="brand">
        <div class="tt">
          <h1>Regularização de Imóveis</h1>
          <div class="sub">Painel de Licenças, Certidões e Documentação Técnica</div>
        </div>
      </div>
      <div class="hr">
        <span class="live"><i class="dot"></i>Dados atualizados</span>
        <button class="btn" id="btnRefresh">Atualizar</button>
      </div>
    </div>
    <div class="farol" id="farolHeader"></div>
    <nav id="navTabs">
      <button aria-selected="true" data-tab="resumo">Visão Geral</button>
      <button aria-selected="false" data-tab="documentos">Documentos (Lista)</button>
      <button aria-selected="false" data-tab="matriz">Matriz por Unidade</button>
      <button aria-selected="false" data-tab="galpoes">Galpões</button>
    </nav>
  </header>

  <section class="fb">
    <div class="fbi">
      <label>Unidade:
        <select id="fUnidade"><option value="">Todas</option></select>
      </label>
      <label>Documento:
        <select id="fDoc"><option value="">Todos</option></select>
      </label>
      <label>Status:
        <select id="fStatus">
          <option value="">Todos</option>
          <option value="VENCIDO">Vencido</option>
          <option value="PENDENTE">Em Andamento</option>
          <option value="V30">Vence em 30d</option>
          <option value="V90">Vence em 90d</option>
          <option value="OK">Regular (OK)</option>
          <option value="SEMDATA">Sem Data</option>
        </select>
      </label>
      <label>Busca:
        <input type="search" id="fSearch" placeholder="Procure por imóvel, doc, órgão...">
      </label>
      <div class="chips" id="activeFilters"></div>
    </div>
  </section>

  <main id="appContent">
    <!-- O conteúdo do Dashboard será renderizado via JavaScript -->
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // Dados de demonstração do sistema
    const MOCK_DATA = [
      { id: 1, unidade: "Galpão Lapa", doc: "AVCB - Corpo de Bombeiros", status: "VENCIDO", vencimento: "2026-01-15", orgao: "Corpo de Bombeiros", obs: "Renovação em trâmite" },
      { id: 2, unidade: "Galpão Lapa", doc: "Alvará de Funcionamento", status: "OK", vencimento: "2027-08-20", orgao: "Prefeitura SP", obs: "Documento regular" },
      { id: 3, unidade: "Galpão Lapa", doc: "Habite-se", status: "OK", vencimento: null, orgao: "Prefeitura SP", obs: "Definitivo" },
      { id: 4, unidade: "CD Guarulhos", doc: "AVCB - Corpo de Bombeiros", status: "V30", vencimento: "2026-11-15", orgao: "Corpo de Bombeiros", obs: "Vistoria agendada" },
      { id: 5, unidade: "CD Guarulhos", doc: "Licença Ambiental", status: "PENDENTE", vencimento: null, orgao: "CETESB", obs: "Aguardando laudo técnico" },
      { id: 6, unidade: "Galpão Mooca", doc: "Alvará de Funcionamento", status: "V90", vencimento: "2026-12-30", orgao: "Prefeitura SP", obs: "Preparar documentação" },
      { id: 7, unidade: "Galpão Mooca", doc: "AVCB - Corpo de Bombeiros", status: "OK", vencimento: "2027-05-10", orgao: "Corpo de Bombeiros", obs: "Válido" },
      { id: 8, unidade: "CD Campinas", doc: "Outorga de Água", status: "SEMDATA", vencimento: null, orgao: "DAEE", obs: "Em análise preliminar" }
    ];

    let state = {
      tab: 'resumo',
      filters: { unidade: '', doc: '', status: '', search: '' },
      data: MOCK_DATA
    };

    function init() {
      setupFilters();
      renderFarol();
      renderTab();
      
      document.getElementById('navTabs').addEventListener('click', (e) => {
        if(e.target.tagName === 'BUTTON') {
          document.querySelectorAll('#navTabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
          e.target.setAttribute('aria-selected', 'true');
          state.tab = e.target.dataset.tab;
          renderTab();
        }
      });

      document.getElementById('btnRefresh').addEventListener('click', () => {
        showToast('Dados atualizados com sucesso!');
      });
    }

    function setupFilters() {
      const unidades = [...new Set(state.data.map(d => d.unidade))];
      const docs = [...new Set(state.data.map(d => d.doc))];

      const uSelect = document.getElementById('fUnidade');
      unidades.forEach(u => uSelect.add(new Option(u, u)));

      const dSelect = document.getElementById('fDoc');
      docs.forEach(d => dSelect.add(new Option(d, d)));

      ['fUnidade', 'fDoc', 'fStatus'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
          const field = id.replace('f', '').toLowerCase();
          state.filters[field] = e.target.value;
          renderTab();
        });
      });

      document.getElementById('fSearch').addEventListener('input', (e) => {
        state.filters.search = e.target.value.toLowerCase();
        renderTab();
      });
    }

    function getFilteredData() {
      return state.data.filter(item => {
        const matchU = !state.filters.unidade || item.unidade === state.filters.unidade;
        const matchD = !state.filters.doc || item.doc === state.filters.doc;
        const matchS = !state.filters.status || item.status === state.filters.status;
        const matchQ = !state.filters.search || 
          item.unidade.toLowerCase().includes(state.filters.search) ||
          item.doc.toLowerCase().includes(state.filters.search) ||
          (item.obs && item.obs.toLowerCase().includes(state.filters.search));
        return matchU && matchD && matchS && matchQ;
      });
    }

    function renderFarol() {
      const total = state.data.length;
      const counts = {
        VENCIDO: state.data.filter(d => d.status === 'VENCIDO').length,
        PENDENTE: state.data.filter(d => d.status === 'PENDENTE').length,
        V30: state.data.filter(d => d.status === 'V30').length,
        V90: state.data.filter(d => d.status === 'V90').length,
        OK: state.data.filter(d => d.status === 'OK').length,
      };

      const farol = document.getElementById('farolHeader');
      farol.innerHTML = `
        <i style="width:${(counts.VENCIDO/total)*100}%;background:var(--venc)"></i>
        <i style="width:${(counts.PENDENTE/total)*100}%;background:var(--pend)"></i>
        <i style="width:${(counts.V30/total)*100}%;background:var(--v30)"></i>
        <i style="width:${(counts.V90/total)*100}%;background:var(--v90)"></i>
        <i style="width:${(counts.OK/total)*100}%;background:var(--ok)"></i>
      `;
    }

    function renderTab() {
      const container = document.getElementById('appContent');
      const filtered = getFilteredData();

      if(state.tab === 'resumo') {
        container.innerHTML = renderResumo(filtered);
      } else if(state.tab === 'documentos') {
        container.innerHTML = renderDocumentos(filtered);
      } else if(state.tab === 'matriz') {
        container.innerHTML = renderMatriz(filtered);
      } else if(state.tab === 'galpoes') {
        container.innerHTML = renderGalpoes(filtered);
      }
    }

    function renderResumo(data) {
      const total = data.length;
      const vencidos = data.filter(d => d.status === 'VENCIDO').length;
      const pendentes = data.filter(d => d.status === 'PENDENTE').length;
      const v30 = data.filter(d => d.status === 'V30').length;
      const ok = data.filter(d => d.status === 'OK').length;

      return `
        <div class="grid g6">
          <div class="kpi k-venc">
            <div class="kv">${vencidos}</div>
            <div class="kl">Vencidos</div>
            <div class="ks">Requer ação imediata</div>
          </div>
          <div class="kpi k-pend">
            <div class="kv">${pendentes}</div>
            <div class="kl">Em Andamento</div>
            <div class="ks">Processo iniciado</div>
          </div>
          <div class="kpi k-v30">
            <div class="kv">${v30}</div>
            <div class="kl">Vence em 30d</div>
            <div class="ks">Atenção preventiva</div>
          </div>
          <div class="kpi k-ok">
            <div class="kv">${ok}</div>
            <div class="kl">Regularizados</div>
            <div class="ks">Documentação OK</div>
          </div>
          <div class="kpi">
            <div class="kv">${total}</div>
            <div class="kl">Total Geral</div>
            <div class="ks">Documentos mapeados</div>
          </div>
        </div>

        <div class="grid g21">
          <div class="card">
            <div class="ct">
              <h2>Visão Consolidada de Documentos</h2>
              <span>Expandido para tela cheia</span>
            </div>
            ${renderTableSummary(data)}
          </div>
          <div class="card">
            <div class="ct">
              <h2>Status Geral</h2>
            </div>
            <div class="sl">
              <div class="sr">
                <span class="sw" style="background:var(--venc)"></span>
                <div><b>${vencidos}</b> <span class="pc">Vencidos</span></div>
              </div>
              <div class="sr">
                <span class="sw" style="background:var(--pend)"></span>
                <div><b>${pendentes}</b> <span class="pc">Em Andamento</span></div>
              </div>
              <div class="sr">
                <span class="sw" style="background:var(--ok)"></span>
                <div><b>${ok}</b> <span class="pc">Concluídos</span></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTableSummary(data) {
      if(!data.length) return `<div class="empty">Nenhum documento encontrado com os filtros atuais.</div>`;
      return `
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Unidade</th>
                <th>Documento</th>
                <th>Órgão</th>
                <th>Status</th>
                <th>Vencimento</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(d => `
                <tr>
                  <td><b>${d.unidade}</b></td>
                  <td>${d.doc}</td>
                  <td>${d.orgao}</td>
                  <td><span class="pill p-${d.status.toLowerCase()}">${d.status}</span></td>
                  <td>${d.vencimento || '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDocumentos(data) {
      return `
        <div class="card">
          <div class="ct">
            <h2>Listagem Detalhada de Documentos</h2>
            <span>Total: ${data.length} registros</span>
          </div>
          ${renderTableSummary(data)}
        </div>
      `;
    }

    function renderMatriz(data) {
      return `
        <div class="card">
          <div class="ct">
            <h2>Matriz de Regularização por Unidade</h2>
          </div>
          <p class="note">Visão em grade correlacionando unidades e status dos documentos.</p>
        </div>
      `;
    }

    function renderGalpoes(data) {
      return `
        <div class="card">
          <div class="ct">
            <h2>Resumo por Galpão / Unidade</h2>
          </div>
          <p class="note">Acompanhamento agrupado por imóvel imobiliário.</p>
        </div>
      `;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
