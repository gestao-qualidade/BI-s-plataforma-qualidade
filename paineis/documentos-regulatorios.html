<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Documentos Regulatórios · PierServ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12203A; --ink2:#3B4A66; --mute:#6B7A93; --line:#DCE2EB; --paper:#EDF0F5; --card:#fff;
  --venc:#C0304F; --pend:#3A4660; --v30:#E3A008; --v90:#8FAE2F; --ok:#0E8A7D; --sem:#A9B4C6;
  --vencBg:#FBE9ED; --pendBg:#E6E9F0; --v30Bg:#FDF3D9; --v90Bg:#EFF5DA; --okBg:#DDF1EE; --semBg:#EEF1F6;
  --navy:#0A1F6B; --royal:#1747B8; --azure:#2F6BFF;
  --num:'IBM Plex Sans Condensed','IBM Plex Sans','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#1747B8;text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid #1747B8;outline-offset:2px}
.hatch{background:repeating-linear-gradient(135deg,#3A4660 0 4px,#5A6684 4px 8px)}

/* header */
header{position:relative;color:#fff;background:linear-gradient(180deg,rgba(2,8,40,.60) 0%,rgba(2,8,40,0) 100%)}
.hd{max-width:1480px;margin:0 auto;padding:20px 28px 8px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:24px;align-items:center}
.logo{height:96px;width:auto;display:block;filter:drop-shadow(0 3px 12px rgba(0,8,50,.55))}
.tt{padding-left:24px;border-left:1px solid rgba(255,255,255,.28)}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.1px;line-height:1.15;text-shadow:0 2px 14px rgba(0,8,50,.45)}
.sub{font-size:13px;color:#C3D3F7;margin-top:4px}
.hr{display:flex;gap:14px;align-items:center;font-size:12px;color:#C9D7F5}
.hr .dot{width:8px;height:8px;border-radius:50%;background:var(--sem);display:inline-block;margin-right:6px}
.hr .live .dot{background:#4EE0C0;box-shadow:0 0 0 3px rgba(78,224,192,.25)}
.btn{background:linear-gradient(180deg,#fff,#DDE8FD);color:var(--navy);border:0;border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px;box-shadow:0 4px 14px -6px rgba(0,8,50,.6)}
.btn:hover{background:#fff}
.btn.sec{background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:none;border-radius:99px} .btn.sec:hover{background:var(--semBg)}
.btn[disabled]{opacity:.6;cursor:wait}
.farol{display:flex;height:5px;background:rgba(255,255,255,.18)}
.farol i{display:block;height:100%}
nav{max-width:1480px;margin:0 auto;padding:6px 28px 14px;display:flex;gap:8px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#DCE7FC;padding:8px 18px;font-size:13px;font-weight:500;border-radius:99px;backdrop-filter:blur(4px)}
nav button[aria-selected=true]{background:#fff;border-color:#fff;color:var(--navy);font-weight:600;box-shadow:0 6px 18px -8px rgba(0,8,50,.7)}
nav button:hover{background:rgba(255,255,255,.18);color:#fff}
nav button[aria-selected=true]:hover{background:#fff;color:var(--navy)}
header :focus-visible{outline-color:#fff}

/* filters */
.fb{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.fbi{max-width:1480px;margin:0 auto;padding:10px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbi label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;color:var(--ink);max-width:260px}
input[type=search]{min-width:230px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--semBg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:0;background:transparent;width:18px;height:18px;border-radius:50%;line-height:16px;color:var(--mute)} .chip button:hover{background:var(--line)}

main{max-width:1480px;margin:0 auto;padding:18px 28px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ct h2{margin:0;font-size:14px;font-weight:600}
.ct span{font-size:12px;color:var(--mute)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* kpis */
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sem);border-radius:6px;padding:12px 14px;text-align:left;width:100%}
button.kpi:hover{background:#F8FAFD}
.kpi .kv{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:13px;font-weight:500;margin-top:4px}
.kpi .ks{font-size:12px;color:var(--mute)}
.k-venc{border-left-color:var(--venc)} .k-pend{border-left-color:var(--pend)} .k-v30{border-left-color:var(--v30)} .k-ok{border-left-color:var(--ok)}
.k-venc .kv{color:var(--venc)}

/* galpões band */
.band{display:grid;grid-template-columns:minmax(220px,1.1fr) repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:center;margin-bottom:14px;border-left:5px solid var(--ink)}
.band h2{margin:0;font-size:14px;font-weight:600} .band p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.bs .n{font-family:var(--num);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bs .t{font-size:12px;color:var(--mute)}

/* status panel */
.sl{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:5px;padding:6px 6px}
.sr:hover{background:var(--semBg)}
.sw{width:12px;height:12px;border-radius:3px}
.sr b{font-family:var(--num);font-size:16px;font-variant-numeric:tabular-nums}
.sr .pc{font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
.mb{grid-column:2/4;height:5px;background:var(--semBg);border-radius:3px;overflow:hidden;margin-top:-2px}
.mb i{display:block;height:100%}

/* bar list */
.bl{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.5fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:5px;padding:5px 6px}
.bl:hover{background:var(--semBg)}
.bn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--semBg)}
.bt i{display:block;height:100%}
.bv{font-family:var(--num);font-size:14px;font-weight:700;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:12px;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
th button{background:none;border:0;font:inherit;font-weight:600;color:inherit;padding:0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:#F8FAFD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
.trunc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.clk{cursor:pointer}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.p-vencido{background:var(--vencBg);color:#8E1B35} .p-pendente{background:var(--pendBg);color:#2B3550}
.p-v30{background:var(--v30Bg);color:#7A5300} .p-v90{background:var(--v90Bg);color:#4B5F10}
.p-ok{background:var(--okBg);color:#0A5E55} .p-semdata{background:var(--semBg);color:#4B586F}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sc button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:500;display:flex;gap:6px;align-items:center}
.sc button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc button .sw{width:9px;height:9px}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--mute)}
.pg button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px} .pg button[disabled]{opacity:.45;cursor:default}

/* matrix */
.mx td,.mx th{vertical-align:top}
.mx td.c{min-width:210px}
.cell{border-radius:5px;padding:7px 10px;border:1px solid transparent}
.cell b{display:block;font-size:13px;font-weight:600}
.cell small{display:block;font-size:12px;opacity:.9}
.cell.vencido{background:var(--vencBg);border-color:#F2C2CD;color:#8E1B35}
.cell.pendente{background:var(--pendBg);border-color:#C9CFDC;color:#2B3550}
.cell.v30{background:var(--v30Bg);border-color:#F1DB9B;color:#7A5300}
.cell.v90{background:var(--v90Bg);border-color:#D4E3A3;color:#4B5F10}
.cell.ok{background:var(--okBg);border-color:#B6DDD7;color:#0A5E55}
.cell.semdata{background:var(--semBg);border-color:var(--line);color:#4B586F}
.cell.nd{background:#fff;border:1px dashed #B9C3D3;color:var(--mute)}

.note{font-size:12px;color:var(--mute);margin-top:18px;max-width:900px}
.empty{padding:34px;text-align:center;color:var(--mute)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;display:none;z-index:20;max-width:360px}
.err{background:var(--vencBg);border:1px solid #F2C2CD;color:#8E1B35;border-radius:6px;padding:14px 16px;margin-bottom:14px}

.fb{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:0;box-shadow:0 10px 28px -14px rgba(2,10,50,.65)}
select,input[type=search]{border-radius:99px;padding:6px 12px;border-color:#CBD7EE}
select{padding-right:8px}
.card,.kpi,.band{border-radius:14px;border:1px solid rgba(255,255,255,.55);box-shadow:0 14px 34px -18px rgba(2,10,50,.75)}
.card,.band{background:linear-gradient(180deg,#fff 0%,#F5F8FE 100%)}
.kpi{background:linear-gradient(135deg,#fff 52%,var(--semBg) 100%)}
.k-venc{background:linear-gradient(135deg,#fff 50%,var(--vencBg) 100%)}

.k-v30{background:linear-gradient(135deg,#fff 50%,var(--v30Bg) 100%)}
.k-v90{background:linear-gradient(135deg,#fff 50%,var(--v90Bg) 100%)}
.k-ok{background:linear-gradient(135deg,#fff 50%,var(--okBg) 100%)}
button.kpi:hover{filter:brightness(.985);transform:translateY(-1px);transition:transform .15s}
.band{border-left:6px solid var(--royal)}
.ct h2{color:var(--navy)}
th{background:#EEF3FC;color:var(--navy);border-bottom:2px solid #C9D6F0}
tbody tr:hover td{background:#F1F6FF}
.sc button[aria-pressed=true]{background:linear-gradient(135deg,var(--navy),var(--azure));border-color:transparent;color:#fff}
.pg button{border-radius:99px}
.chip{background:#EAF0FD;border-color:#C9D6F0}
.note{color:#C7D5F4}
.empty{background:#fff;border-radius:14px;color:var(--mute)}
.toast{background:linear-gradient(135deg,var(--navy),var(--royal));border-radius:12px;box-shadow:0 12px 30px -10px rgba(2,10,50,.8)}
a{color:var(--royal)}
@media (max-width:640px){.logo{height:64px}.tt{padding-left:14px}h1{font-size:19px}}

@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g21,.g11{grid-template-columns:minmax(0,1fr)}.band{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.hd,.fbi,main,nav{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== polimento visual v2 ===== */
header{background:
  radial-gradient(760px 300px at 10% -10%,rgba(120,175,255,.34),transparent 70%),
  radial-gradient(620px 260px at 96% 0%,rgba(70,130,255,.28),transparent 70%),
  linear-gradient(180deg,rgba(2,8,40,.62) 0%,rgba(2,8,40,0) 100%)}
.logo{height:108px;filter:drop-shadow(0 0 22px rgba(130,180,255,.55)) drop-shadow(0 4px 12px rgba(0,8,50,.6))}
h1{font-size:27px;background:linear-gradient(180deg,#fff 30%,#BFD4FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 12px rgba(0,8,50,.45))}
.sub{color:#B9CCF5;letter-spacing:.3px}
.hr{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:7px 8px 7px 16px;backdrop-filter:blur(10px);box-shadow:0 10px 30px -14px rgba(0,8,50,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.hr .live .dot{animation:pulso 2s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(78,224,192,.55)}70%{box-shadow:0 0 0 8px rgba(78,224,192,0)}100%{box-shadow:0 0 0 0 rgba(78,224,192,0)}}
.btn{background:linear-gradient(180deg,#fff 0%,#D5E3FF 100%);box-shadow:0 6px 18px -6px rgba(0,8,50,.7),inset 0 -2px 0 rgba(23,71,184,.12);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(0,8,50,.8)}
.btn.busy{position:relative;padding-left:36px}
.btn.busy::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:2px solid rgba(23,71,184,.25);border-top-color:var(--royal);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.farol{height:6px;box-shadow:0 0 22px rgba(70,140,255,.55)}
nav button{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-color:rgba(255,255,255,.25);transition:background .15s,transform .15s}
nav button:hover{transform:translateY(-1px)}
nav button[aria-selected=true]{background:linear-gradient(180deg,#fff,#DDE8FF)}
.fb{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(240,245,255,.96))}
.card,.band{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(241,246,255,.96) 100%);border:1px solid rgba(255,255,255,.7);box-shadow:0 18px 40px -20px rgba(2,10,50,.85),inset 0 1px 0 #fff}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--azure),#79B0FF 55%,transparent)}
.band::before{display:none}
.kpi{position:relative;transition:transform .18s,box-shadow .18s;box-shadow:0 14px 30px -18px rgba(2,10,50,.85),inset 0 1px 0 #fff}
button.kpi:hover{transform:translateY(-3px);box-shadow:0 20px 36px -18px rgba(2,10,50,.9);filter:none}
.kpi .kv{background:linear-gradient(180deg,var(--navy),var(--royal));-webkit-background-clip:text;background-clip:text;color:transparent}
.k-venc .kv{background:linear-gradient(180deg,#D8395A,#A21F40);-webkit-background-clip:text;background-clip:text}
.k-ok .kv{background:linear-gradient(180deg,#12A593,#0A6F64);-webkit-background-clip:text;background-clip:text}
.k-v30 .kv{background:linear-gradient(180deg,#E5A112,#B97C00);-webkit-background-clip:text;background-clip:text}
.ct h2{background:linear-gradient(90deg,var(--navy),var(--royal));-webkit-background-clip:text;background-clip:text;color:transparent}
th{background:linear-gradient(180deg,#F2F6FF,#E3ECFC)}
tbody tr:nth-child(even) td{background:rgba(238,244,255,.55)}
tbody tr:hover td{background:#E8F0FF}
.bt,.mb{box-shadow:inset 0 1px 2px rgba(10,31,107,.12)}
.bt i:not(.hatch),.mb i:not(.hatch){background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
.pill{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.toast{background:linear-gradient(135deg,#0A1F6B,#1747B8 70%,#2F6BFF)}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#9DB5E8;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:640px){.logo{height:68px}h1{font-size:20px}.hr{padding:6px 6px 6px 12px}}

/* filtro de status (multi-seleção) */
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;font-size:13px;border:1px solid #CBD7EE;border-radius:99px;padding:6px 30px 6px 12px;background:#fff;color:var(--ink);position:relative;user-select:none;white-space:nowrap}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg)}
.ms[open] summary{border-color:var(--royal);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.ms.on summary{background:linear-gradient(135deg,var(--navy),var(--azure));border-color:transparent;color:#fff}
.ms.on summary::after{border-color:#fff}
.msp{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:2px;box-shadow:0 22px 44px -16px rgba(2,10,50,.55)}
.fbi .msp label{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:9px;font-size:13px;color:var(--ink);cursor:pointer}
.fbi .msp label:hover{background:#EEF3FC}
.msp input{accent-color:var(--royal);width:15px;height:15px;margin:0}
.msp .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.msp .btn{margin-top:6px;justify-self:end;padding:5px 12px;font-size:12px}

/* tabela do detalhamento: cabe na tela (sem cortar a Situação) */
.tbd{table-layout:fixed;min-width:1000px}
.tbd .trunc{max-width:100%}
.tbd td{padding:7px 8px}
.tbd th{padding:8px 8px}
.tbd .pill{white-space:normal;text-align:center;line-height:1.25;padding:2px 9px}
</style>

/* ============================ ESTADO ============================ */
const DIA = 864e5;
const ORDEM = ['vencido','pendente','v30','v90','semdata','ok'];
const ST = {
  vencido:{l:'Vencido',v:'--venc'}, pendente:{l:'Sem arquivo',v:'--pend'},
  v30:{l:'Vence em até 30 dias',v:'--v30'}, v90:{l:'Vence em 31 a 90 dias',v:'--v90'},
  semdata:{l:'Sem data de vencimento',v:'--sem'}, ok:{l:'Em dia (mais de 90 dias)',v:'--ok'}
};
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const S = {
  hoje: inicioDia(new Date()), mode:'snapshot', info:'', tab:'geral',
  forn:[], pend:[], galp:[],
  f:{obrig:'sim', etapa:'', seg:'', doc:'', q:'', status:new Set(), bucket:''},
  sort:{k:'sev', dir:1}, page:0, erro:''
};

/* ============================ UTILITÁRIOS ============================ */
function inicioDia(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function norm(v){return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseData(v){
  if(!v) return null;
  if(v instanceof Date) return inicioDia(v);
  const s=String(v); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m? new Date(+m[3],+m[2]-1,+m[1]) : null;
}
function fmtData(d){return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : '—'}
function diasAte(d){return Math.round((d-S.hoje)/DIA)}
function txtDias(n){
  if(n==null) return '—'; if(n===0) return 'hoje'; if(n===1) return 'amanhã'; if(n===-1) return 'ontem';
  return n<0? 'há '+(-n)+' dias' : 'em '+n+' dias';
}
function nf(n){return Number(n).toLocaleString('pt-BR')}
function pct(a,b){return b? Math.round(a/b*100) : 0}
function classificar(temArq,venc,dias){
  if(!temArq) return 'pendente';
  if(!venc) return 'semdata';
  if(dias<0) return 'vencido';
  if(dias<=30) return 'v30';
  if(dias<=90) return 'v90';
  return 'ok';
}
function docKey(s){return norm(s).replace(/[()\-\/]/g,' ').replace(/\s+/g,' ').trim()}
function bucketOf(r){
  if(r.st==='pendente') return 'pend';
  if(r.st==='vencido') return 'venc';
  if(r.st==='semdata') return 'sem';
  const mi=(r.venc.getFullYear()-S.hoje.getFullYear())*12+r.venc.getMonth()-S.hoje.getMonth();
  return mi>=12? 'm12' : 'm'+mi;
}
function toast(msg,ms){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>t.style.display='none',ms)}

/* ============================ DADOS ============================ */
function idx(t){const m={};(t.cols||[]).forEach((c,i)=>m[c]=i);return m}
function normLink(l){l=l||'';return l&&!/^https?:/.test(l)? LINK_BASE+l+'/s' : l}

function normPend(t){
  const i=idx(t), nomes={};
  return (t.rows||[]).map(r=>{
    const g=c=>r[i[c]];
    const arq=g('Arquivo'), venc=parseData(g('Data de vencimento'));
    const o={
      seg:g('Título do segmento (avaliação)')||'(sem segmento)',
      doc:g('Documento específico do segmento')||'(sem nome)',
      obr:['sim','yes','1','true'].includes(norm(g('Obrigatório?'))),
      cod:g('Código do fornecedor')||'', forn:g('Nome do fornecedor')||'',
      etapa:g('Etapa do fornecedor')||'', arq:!!arq&&String(arq).trim()!=='',
      arquivo:arq||'', venc, link:normLink(g('Link do fornecedor'))
    };
    o.dias=venc? diasAte(venc):null;
    o.st=classificar(o.arq,venc,o.dias);
    o.crit=o.obr&&(o.st==='pendente'||o.st==='vencido');
    o.dkey=docKey(o.doc); if(!nomes[o.dkey]) nomes[o.dkey]=o.doc; o.docNome=nomes[o.dkey];
    o.busca=norm([o.forn,o.cod,o.seg,o.doc].join(' '));
    return o;
  });
}
function normForn(t){
  const i=idx(t);
  return (t.rows||[]).map(r=>{
    const g=c=>r[i[c]];
    const venc=parseData(g('Data de vencimento')), env=parseData(g('Data de envio do arquivo'));
    const o={
      galp:String(g('Galpão')||'OUTROS').toUpperCase(),
      doc:g('Documento de contato')||g('Documento específico do segmento')||'(sem nome)',
      forn:g('Nome do fornecedor')||'', venc, env, link:normLink(g('Link do fornecedor'))
    };
    o.dias=venc? diasAte(venc):null;
    o.st=classificar(!!env||!!venc,venc,o.dias);
    return o;
  });
}
function setData(d){
  S.hoje=inicioDia(new Date());
  S.pend=normPend(d.pendentes||{}); S.galp=normForn(d.fornecedores||{});
  S.info=d.atualizadoEm||''; S.erro='';
  montarFiltros(); render();
}
function carregar(manual){
  const live=(window.google&&google.script&&google.script.run);
  const ok=d=>{if(d&&d.erro){falha(d.erro);return} setData(d);defineFonte();if(manual)toast('Dados atualizados.',3000)};
  if(live){
    S.mode='apps';
    google.script.run.withSuccessHandler(ok).withFailureHandler(e=>falha(e&&e.message||String(e))).getDadosDashboard();
  }else if(CONFIG.API_URL){
    S.mode='api';
    fetch(CONFIG.API_URL+(CONFIG.API_URL.includes('?')?'&':'?')+'formato=json&token='+encodeURIComponent(CONFIG.API_TOKEN)+'&_='+Date.now(),{cache:'no-store'})
      .then(r=>r.json()).then(ok).catch(e=>falha(e.message));
  }else{
    S.mode='snapshot'; setData(SNAPSHOT); defineFonte();
  }
}
function falha(msg){
  S.erro=msg; 
  if(SNAPSHOT&&!S.pend.length){S.mode='snapshot';setData(SNAPSHOT)}
  defineFonte(); render();
}
function defineFonte(){
  const el=document.getElementById('src');
  if(S.mode==='snapshot') el.innerHTML='<span><i class="dot"></i>Cópia estática · sem conexão ao vivo</span>';
  else el.innerHTML='<span class="live"><i class="dot"></i>Qualiex via Planilhas · '+esc(S.info||'atualizado')+'</span>';
  if(!atualizando) document.getElementById('btnRefresh').textContent= (S.mode==='apps'||S.mode==='api')? 'Atualizar do Qualiex' : 'Recarregar';
}
let atualizando=false;
async function atualizarApi(b){
  if(atualizando) return;
  atualizando=true; b.disabled=true; b.classList.add('busy'); b.textContent='Atualizando…';
  const base=CONFIG.API_URL+(CONFIG.API_URL.includes('?')?'&':'?')+'token='+encodeURIComponent(CONFIG.API_TOKEN);
  const call=a=>fetch(base+'&acao='+a+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  try{
    const antes=S.info;
    toast('Buscando no Qualiex… pode levar 1 a 2 minutos.');
    let st=await call('atualizar');
    if(st.erro) throw new Error(st.erro);
    if(st.recente){carregar(true);return}
    const limite=Date.now()+8*60000;
    while(st.rodando&&Date.now()<limite){
      await new Promise(r=>setTimeout(r,6000));
      st=await call('status');
      if(st.erro) throw new Error(st.erro);
    }
    if(st.rodando) throw new Error('está demorando mais que o normal; tente recarregar em alguns minutos');
    if(st.atualizadoEm&&st.atualizadoEm===antes){
      toast('O Qualiex não trouxe dados novos. Mantive os anteriores; confira o login no Apps Script.',9000);
      carregar(false);
    }else carregar(true);
  }catch(e){toast('Falha ao atualizar: '+e.message,9000)}
  finally{atualizando=false;b.disabled=false;b.classList.remove('busy');defineFonte()}
}
function atualizar(){
  const b=document.getElementById('btnRefresh');
  if(S.mode==='api'){atualizarApi(b);return}
  if(S.mode!=='apps'){carregar(true);return}
  b.disabled=true; toast('Buscando no Qualiex… pode levar 1 a 2 minutos.');
  google.script.run
    .withSuccessHandler(d=>{b.disabled=false;setData(d);defineFonte();toast('Dados atualizados do Qualiex.',4000)})
    .withFailureHandler(e=>{b.disabled=false;toast('Falha ao atualizar: '+(e&&e.message||e),8000)})
    .atualizarDoQualiex();
}

/* ============================ FILTROS ============================ */
function filtrar(rows,o){
  o=o||{}; const f=S.f, q=norm(f.q);
  return rows.filter(r=>{
    if(f.obrig==='sim'&&!r.obr) return false;
    if(f.obrig==='nao'&&r.obr) return false;
    if(f.etapa&&r.etapa!==f.etapa) return false;
    if(f.seg&&r.seg!==f.seg) return false;
    if(f.doc&&r.dkey!==f.doc) return false;
    if(q&&r.busca.indexOf(q)<0) return false;
    if(!o.semStatus&&f.status.size&&!f.status.has(r.st)) return false;
    if(!o.semBucket&&f.bucket&&bucketOf(r)!==f.bucket) return false;
    return true;
  });
}
function montarFiltros(){
  const et=[...new Set(S.pend.map(r=>r.etapa).filter(Boolean))].sort();
  const sg=[...new Set(S.pend.map(r=>r.seg))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const fill=(id,arr,cur)=>{const el=document.getElementById(id);const first=el.options[0].outerHTML;el.innerHTML=first+arr.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');el.value=cur||''};
  fill('fEtapa',et,S.f.etapa); fill('fSeg',sg,S.f.seg);
  document.getElementById('fObr').value=S.f.obrig;
}
const FST=[['pendente','Sem arquivo','--pend'],['vencido','Vencido','--venc'],['v30','Até 30 dias','--v30'],['v90','De 31 a 90 dias','--v90'],['ok','Mais de 90 dias','--ok'],['semdata','Sem data de vencimento','--sem']];
function montarStatus(){
  document.getElementById('fStatusPanel').innerHTML=FST.map(x=>'<label><input type="checkbox" data-st="'+x[0]+'"><i class="sw'+(x[0]==='pendente'?' hatch':'')+'"'+(x[0]==='pendente'?'':' style="background:var('+x[2]+')"')+'></i>'+x[1]+'</label>').join('')
    +'<button type="button" class="btn sec" data-a="stclear">Limpar status</button>';
}
function syncStatus(){
  const f=S.f.status;
  document.querySelectorAll('#fStatusPanel input[data-st]').forEach(i=>{i.checked=f.has(i.dataset.st)});
  const sel=FST.filter(x=>f.has(x[0]));
  document.getElementById('fStatusSum').textContent='Status: '+(sel.length===0?'Todos':sel.length===1?sel[0][1]:sel.length+' selecionados');
  document.getElementById('fStatus').classList.toggle('on',sel.length>0);
}
function chips(){
  const f=S.f, c=[];
  const add=(k,t)=>c.push('<span class="chip">'+esc(t)+'<button data-a="rm" data-v="'+k+'" aria-label="Remover filtro">×</button></span>');
  if(f.doc){const r=S.pend.find(x=>x.dkey===f.doc);add('doc','Documento: '+(r?r.docNome:f.doc))}
  if(f.bucket) add('bucket','Régua: '+rotulo(f.bucket));
  syncStatus();
  document.getElementById('chips').innerHTML=c.join('');
  document.getElementById('fb').style.display= S.tab==='galpoes'? 'none':'';
}
function rotulo(b){
  if(b==='pend') return 'Sem arquivo'; if(b==='venc') return 'Vencidos'; if(b==='sem') return 'Sem vencimento'; if(b==='m12') return 'Depois de 12 meses';
  const n=+b.slice(1), d=new Date(S.hoje.getFullYear(),S.hoje.getMonth()+n,1);
  return MES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2);
}

/* ============================ RESUMOS ============================ */
function resumo(rows){
  const c={vencido:0,pendente:0,v30:0,v90:0,semdata:0,ok:0}, fs=new Set(), fc=new Set();
  rows.forEach(r=>{c[r.st]++;fs.add(r.cod||r.forn);if(r.crit)fc.add(r.cod||r.forn)});
  return {c,total:rows.length,forns:fs.size,fornCrit:fc.size};
}
function agrupar(rows,keyFn,nameFn){
  const m=new Map();
  rows.forEach(r=>{
    const k=keyFn(r); let g=m.get(k);
    if(!g){g={k,name:nameFn(r),venc:0,pendente:0,v30:0,total:0,r};m.set(k,g)}
    g.total++; if(r.st==='vencido')g.venc++; else if(r.st==='pendente')g.pendente++; else if(r.st==='v30')g.v30++;
  });
  return [...m.values()];
}

/* ============================ RENDER ============================ */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.tab));
  chips(); farol();
  const el=document.getElementById('main');
  let h=S.erro? '<div class="err"><b>Não foi possível carregar os dados ao vivo.</b> '+esc(S.erro)+'. Exibindo a última cópia disponível.</div>':'';
  if(!S.pend.length&&!S.galp.length){el.innerHTML=h+'<div class="empty">Sem dados para exibir. Rode a importação no Qualiex e atualize.</div>';return}
  h+= S.tab==='geral'? vGeral() : S.tab==='galpoes'? vGalpoes() : vDetalhe();
  el.innerHTML=h;
}
function farol(){
  const r=resumo(S.pend.filter(x=>x.obr)), el=document.getElementById('farol');
  el.innerHTML=ORDEM.map(s=>{
    const w=pct(r.c[s],r.total); if(!r.c[s]) return '';
    return '<i title="'+ST[s].l+': '+nf(r.c[s])+' ('+w+'%) dos documentos obrigatórios" style="width:'+(r.c[s]/r.total*100)+'%;'+(s==='pendente'?'':'background:var('+ST[s].v+')')+'" class="'+(s==='pendente'?'hatch':'')+'"></i>';
  }).join('');
}
function kpi(cls,v,l,s,act){
  return '<button class="kpi '+cls+'" data-a="'+act+'"><div class="kv">'+v+'</div><div class="kl">'+l+'</div><div class="ks">'+s+'</div></button>';
}

/* ---------- visão geral ---------- */
function vGeral(){
  const rows=filtrar(S.pend,{semBucket:true});
  const R=resumo(rows), g=resumo(S.galp), c=R.c;
  const conf=pct(R.total-c.pendente-c.vencido,R.total);
  let h='';
  h+='<div class="card band">'
    +'<div><h2>Galpões · documentos regulatórios</h2><p>Matriz e Sanca · '+g.total+' registros</p></div>'
    +bs(g.c.vencido,'vencidos','var(--venc)')+bs(g.c.v30,'vencem em 30 dias','var(--v30)')+bs(g.c.pendente+g.c.semdata,'sem arquivo ou sem data','var(--pend)')+bs(g.c.ok+g.c.v90,'em dia','var(--ok)')
    +'<button class="btn sec" data-a="tab" data-v="galpoes">Ver matriz</button></div>';
  h+='<div class="grid g6">'
    +kpi('',nf(R.total),'Documentos no escopo',nf(R.forns)+' fornecedores','x')
    +kpi('k-pend',nf(c.pendente),'Sem arquivo',pct(c.pendente,R.total)+'% do escopo','st:pendente')
    +kpi('k-venc',nf(c.vencido),'Vencidos',pct(c.vencido,R.total)+'% do escopo','st:vencido')
    +kpi('k-v30',nf(c.v30),'Vencem em 30 dias',nf(c.v90)+' vencem em 31 a 90','st:v30')
    +kpi('k-ok',conf+'%','Conformidade','com arquivo e dentro da validade','st:ok')
    +kpi('k-venc',nf(R.fornCrit),'Fornecedores críticos','com documento vencido ou sem arquivo','crit')
    +'</div>';
  h+='<div class="grid g21"><div class="card"><div class="ct"><h2>Régua de vencimentos</h2><span>Clique em uma barra para ver os documentos</span></div>'+regua(rows)+legenda()+'</div>'
    +'<div class="card"><div class="ct"><h2>Situação dos documentos</h2><span>'+nf(R.total)+' no total</span></div>'+painelStatus(R)+'</div></div>';
  const crit=rows.filter(r=>r.st==='pendente'||r.st==='vencido'||r.st==='v30');
  const segs=agrupar(crit,r=>r.seg,r=>r.seg).sort((a,b)=>(b.venc+b.pendente)-(a.venc+a.pendente)||b.v30-a.v30).slice(0,10);
  const docs=agrupar(crit,r=>r.dkey,r=>r.docNome).sort((a,b)=>(b.venc+b.pendente)-(a.venc+a.pendente)||b.v30-a.v30).slice(0,10);
  h+='<div class="grid g11"><div class="card"><div class="ct"><h2>Segmentos com mais pendências</h2><span>sem arquivo, vencidos e a vencer em 30 dias</span></div>'+barras(segs,'seg')+barLeg()+'</div>'
    +'<div class="card"><div class="ct"><h2>Documentos mais críticos</h2><span>mesmo critério, agrupado pelo nome do documento</span></div>'+barras(docs,'doc')+barLeg()+'</div></div>';
  h+='<div class="card"><div class="ct"><h2>Fornecedores prioritários</h2><span>15 com mais documentos vencidos ou sem arquivo</span></div>'+tabForn(rows)+'</div>';
  h+='<p class="note">Sem arquivo: documento exigido no segmento e ainda sem upload no Qualiex. Conformidade: documentos com arquivo e fora da condição de vencido, incluindo os sem data de vencimento. Os prazos são calculados com a data de hoje do seu navegador.</p>';
  return h;
}
function bs(n,t,cor){return '<div class="bs"><div class="n" style="color:'+cor+'">'+nf(n)+'</div><div class="t">'+t+'</div></div>'}
function legenda(){
  return '<div class="leg"><span><i class="hatch"></i>Sem arquivo</span><span><i style="background:var(--venc)"></i>Vencido</span><span><i style="background:var(--v30)"></i>Até 30 dias</span><span><i style="background:var(--v90)"></i>31 a 90 dias</span><span><i style="background:var(--ok)"></i>Mais de 90 dias</span><span><i style="background:var(--sem)"></i>Sem data de vencimento</span></div>';
}
function barLeg(){return '<div class="leg"><span><i style="background:var(--venc)"></i>Vencido</span><span><i class="hatch"></i>Sem arquivo</span><span><i style="background:var(--v30)"></i>Até 30 dias</span></div>'}
function painelStatus(R){
  return '<div class="sl">'+ORDEM.map(s=>{
    const n=R.c[s];
    return '<button class="sr" data-a="st" data-v="'+s+'"><i class="sw '+(s==='pendente'?'hatch':'')+'" style="'+(s==='pendente'?'':'background:var('+ST[s].v+')')+'"></i><span>'+ST[s].l+'</span><span><b>'+nf(n)+'</b><span class="pc">'+pct(n,R.total)+'%</span></span>'
      +'<span class="mb"><i class="'+(s==='pendente'?'hatch':'')+'" style="width:'+pct(n,R.total)+'%;'+(s==='pendente'?'':'background:var('+ST[s].v+')')+'"></i></span></button>';
  }).join('')+'</div>';
}
function regua(rows){
  const ids=['pend','venc'];for(let i=0;i<12;i++)ids.push('m'+i);ids.push('m12','sem');
  const B={};ids.forEach(i=>B[i]={v30:0,v90:0,ok:0,n:0});
  rows.forEach(r=>{const b=B[bucketOf(r)];b.n++;if(r.st==='v30'||r.st==='v90'||r.st==='ok')b[r.st]++});
  const W=840,H=250,mt=26,mb=46,ml=6,sl=(W-ml*2)/ids.length,bw=Math.min(36,sl-12),ch=H-mt-mb;
  const mx=Math.max(1,...ids.map(i=>B[i].n)), y=v=>v/mx*ch;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Distribuição dos documentos por vencimento"><defs><pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#3A4660"/><rect width="4" height="8" fill="#5A6684"/></pattern>'+
    [['gV','#E04A6A','#B02548'],['gO','#14B3A2','#0B7A6E'],['gG','#A9CB45','#7F9E26'],['gY','#F5B82E','#D99200'],['gS','#BCC6D8','#98A5BC']]
      .map(g=>'<linearGradient id="'+g[0]+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+g[1]+'"/><stop offset="1" stop-color="'+g[2]+'"/></linearGradient>').join('')+'</defs>';
  s+='<line x1="'+ml+'" x2="'+(W-ml)+'" y1="'+(mt+ch)+'" y2="'+(mt+ch)+'" stroke="#DCE2EB"/>';
  const xh=ml+sl*2;
  s+='<line x1="'+xh+'" x2="'+xh+'" y1="12" y2="'+(mt+ch)+'" stroke="#12203A" stroke-dasharray="3 3"/><text x="'+(xh+5)+'" y="14" font-size="11" fill="#12203A">hoje</text>';
  ids.forEach((id,k)=>{
    const b=B[id], x=ml+k*sl+(sl-bw)/2; let yy=mt+ch;
    const parts=id==='pend'? [[y(b.n),'url(#ht)']] : id==='venc'? [[y(b.n),'url(#gV)']] : id==='sem'? [[y(b.n),'url(#gS)']]
      : [[y(b.ok),'url(#gO)'],[y(b.v90),'url(#gG)'],[y(b.v30),'url(#gY)']];
    const vis=parts.filter(p=>p[0]>0);
    vis.forEach((p,j)=>{
      const h=p[0], top=j===vis.length-1; yy-=h;
      if(top){const r=Math.min(5,h,bw/2);
        s+='<path d="M'+x+','+(yy+h)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+bw-r)+'Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+r)+'V'+(yy+h)+'Z" fill="'+p[1]+'"/>'}
      else s+='<rect x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+h+'" fill="'+p[1]+'"/>';
    });
    if(b.n) s+='<text x="'+(x+bw/2)+'" y="'+(yy-5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#12203A" font-family="IBM Plex Sans Condensed,Arial">'+nf(b.n)+'</text>';
    let l1,l2='';
    if(id==='pend'){l1='Sem';l2='arquivo'}else if(id==='venc'){l1='Vencidos'}else if(id==='sem'){l1='Sem';l2='venc.'}else if(id==='m12'){l1='Depois';l2='12 meses'}
    else{const t=rotulo(id).split('/');l1=t[0];l2=t[1]}
    s+='<text x="'+(x+bw/2)+'" y="'+(mt+ch+16)+'" text-anchor="middle" font-size="11" fill="#3B4A66">'+l1+'</text><text x="'+(x+bw/2)+'" y="'+(mt+ch+29)+'" text-anchor="middle" font-size="11" fill="#6B7A93">'+l2+'</text>';
    s+='<rect data-a="bucket" data-v="'+id+'" x="'+(ml+k*sl)+'" y="'+mt+'" width="'+sl+'" height="'+(ch+mb-6)+'" fill="transparent" style="cursor:pointer"><title>'+rotulo(id)+': '+nf(b.n)+' documentos</title></rect>';
  });
  return s+'</svg>';
}
function barras(items,tipo){
  if(!items.length) return '<div class="empty">Nenhuma pendência com os filtros atuais.</div>';
  const mx=Math.max(1,...items.map(i=>i.venc+i.pendente+i.v30));
  return items.map(i=>{
    const n=i.venc+i.pendente+i.v30, w=v=>(v/mx*100)+'%';
    return '<button class="bl" data-a="'+tipo+'" data-v="'+encodeURIComponent(i.k)+'" title="'+esc(i.name)+'"><span class="bn">'+esc(i.name)+'</span>'
      +'<span class="bt"><i style="width:'+w(i.venc)+';background:var(--venc)"></i><i class="hatch" style="width:'+w(i.pendente)+'"></i><i style="width:'+w(i.v30)+';background:var(--v30)"></i></span>'
      +'<span class="bv" title="'+i.venc+' vencidos, '+i.pendente+' sem arquivo, '+i.v30+' a vencer em 30 dias">'+n+'</span></button>';
  }).join('');
}
function tabForn(rows){
  const m=new Map();
  rows.forEach(r=>{
    const k=r.cod||r.forn; let g=m.get(k);
    if(!g){g={cod:r.cod,forn:r.forn,etapa:r.etapa,link:r.link,p:0,v:0,a:0,t:0};m.set(k,g)}
    g.t++; if(r.st==='pendente')g.p++; else if(r.st==='vencido')g.v++; else if(r.st==='v30')g.a++;
  });
  const l=[...m.values()].filter(g=>g.p+g.v>0).sort((a,b)=>(b.p+b.v)-(a.p+a.v)||b.a-a.a).slice(0,15);
  if(!l.length) return '<div class="empty">Nenhum fornecedor com pendência crítica.</div>';
  return '<div class="tw"><table><thead><tr><th>Fornecedor</th><th>Etapa</th><th class="num">Sem arquivo</th><th class="num">Vencidos</th><th class="num">Vencem em 30 dias</th><th class="num">Documentos</th><th></th></tr></thead><tbody>'
    +l.map(g=>'<tr class="clk" data-a="fq" data-v="'+encodeURIComponent(g.cod||g.forn)+'"><td><div class="trunc" title="'+esc(g.forn)+'">'+esc(g.forn)+'</div><small style="color:var(--mute)">'+esc(g.cod)+'</small></td><td class="nw">'+esc(g.etapa)+'</td><td class="num">'+g.p+'</td><td class="num" style="color:var(--venc);font-weight:600">'+g.v+'</td><td class="num">'+g.a+'</td><td class="num">'+g.t+'</td><td class="nw">'+(g.link?'<a href="'+esc(g.link)+'" target="_blank" rel="noopener" data-x="1">Abrir no Qualiex</a>':'')+'</td></tr>').join('')
    +'</tbody></table></div>';
}

/* ---------- galpões ---------- */
function vGalpoes(){
  const rows=S.galp, g=resumo(rows);
  const galps=[...new Set(rows.map(r=>r.galp))].sort();
  const docs=[...new Set(rows.map(r=>r.doc))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const get=(d,gp)=>rows.find(r=>r.doc===d&&r.galp===gp);
  let h='<div class="grid g6">'
    +kpi('k-venc',g.c.vencido,'Vencidos','documentos regulatórios dos galpões','x')
    +kpi('k-v30',g.c.v30,'Vencem em 30 dias','','x')
    +kpi('k-pend',g.c.pendente,'Sem documento','registro sem arquivo enviado','x')
    +kpi('',g.c.semdata,'Sem data de vencimento','','x')
    +kpi('k-ok',g.c.v90+g.c.ok,'Em dia','vencem em mais de 30 dias','x')
    +kpi('',docs.length*galps.length-rows.length,'Não cadastrados','combinações documento × galpão ausentes','x')+'</div>';
  h+='<div class="card"><div class="ct"><h2>Matriz de conformidade por galpão</h2><span>Cada célula mostra a situação do documento no galpão</span></div><div class="tw"><table class="mx"><thead><tr><th>Documento</th>'+galps.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'
    +docs.map(d=>'<tr><td><b style="font-weight:500">'+esc(d)+'</b></td>'+galps.map(gp=>{
      const r=get(d,gp);
      if(!r) return '<td class="c"><div class="cell nd"><b>Não cadastrado</b><small>sem registro neste galpão</small></div></td>';
      const t=r.st==='pendente'?'Sem documento':r.st==='semdata'?'Sem data de vencimento':r.venc?fmtData(r.venc):'—';
      const s2=r.st==='pendente'?'arquivo não enviado':r.st==='semdata'?'arquivo enviado':ST[r.st].l+' · '+txtDias(r.dias);
      return '<td class="c"><div class="cell '+r.st+'"><b>'+t+'</b><small>'+s2+'</small></div></td>';
    }).join('')+'</tr>').join('')+'</tbody></table></div>'+legenda()+'</div>';
  const prox=[...rows].filter(r=>r.venc).sort((a,b)=>a.venc-b.venc).slice(0,12);
  h+='<div class="card" style="margin-top:14px"><div class="ct"><h2>Ordem de vencimento</h2><span>12 primeiros, dos mais atrasados aos mais distantes</span></div><div class="tw"><table><thead><tr><th>Galpão</th><th>Documento</th><th>Vencimento</th><th>Prazo</th><th>Situação</th><th></th></tr></thead><tbody>'
    +prox.map(r=>'<tr><td>'+esc(r.galp)+'</td><td>'+esc(r.doc)+'</td><td class="nw">'+fmtData(r.venc)+'</td><td class="nw">'+txtDias(r.dias)+'</td><td><span class="pill p-'+r.st+'">'+ST[r.st].l+'</span></td><td class="nw">'+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">Abrir no Qualiex</a>':'')+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h;
}

/* ---------- detalhamento ---------- */
const SEV={vencido:0,pendente:1,v30:2,v90:3,semdata:4,ok:5};
const COLS=[['forn','Fornecedor'],['seg','Segmento'],['doc','Documento'],['obr','Obrig.'],['etapa','Etapa'],['arq','Arquivo'],['venc','Vencimento'],['dias','Prazo'],['sev','Situação']];
function valSort(r,k){
  if(k==='sev') return SEV[r.st]*100000+(r.dias==null?99999:Math.min(r.dias+50000,99999));
  if(k==='venc'||k==='dias') return r.dias==null? 1e9 : r.dias;
  if(k==='obr'||k==='arq') return r[k]?0:1;
  return norm(r[k]);
}
function vDetalhe(){
  const base=filtrar(S.pend,{semStatus:true});
  const R=resumo(base);
  let rows=filtrar(S.pend);
  const k=S.sort.k, d=S.sort.dir;
  rows=rows.map(r=>[valSort(r,k),r]).sort((a,b)=>(a[0]<b[0]?-1:a[0]>b[0]?1:0)*d).map(x=>x[1]);
  const PP=100, pages=Math.max(1,Math.ceil(rows.length/PP)); if(S.page>=pages)S.page=pages-1;
  const sl=rows.slice(S.page*PP,S.page*PP+PP);
  let h='<div class="card"><div class="sc">'+ORDEM.map(s=>'<button data-a="stt" data-v="'+s+'" aria-pressed="'+S.f.status.has(s)+'"><i class="sw '+(s==='pendente'?'hatch':'')+'" style="'+(s==='pendente'?'':'background:var('+ST[s].v+')')+'"></i>'+ST[s].l+' <b>'+nf(R.c[s])+'</b></button>').join('')
    +'<button class="btn sec" data-a="csv" style="margin-left:auto;border-radius:99px">Exportar CSV ('+nf(rows.length)+')</button></div>';
  if(!rows.length) return h+'<div class="empty">Nenhum documento com os filtros atuais.</div></div>';
  h+='<div class="tw"><table class="tbd"><colgroup><col style="width:18%"><col style="width:16%"><col style="width:17%"><col style="width:5%"><col style="width:8%"><col style="width:7%"><col style="width:9%"><col style="width:8%"><col style="width:12%"></colgroup><thead><tr>'+COLS.map(c=>'<th'+(c[0]==='dias'?' class="num"':'')+'><button data-a="sort" data-v="'+c[0]+'">'+c[1]+(S.sort.k===c[0]?(S.sort.dir>0?' ▲':' ▼'):'')+'</button></th>').join('')+'</tr></thead><tbody>'
    +sl.map(r=>'<tr><td><div class="trunc" title="'+esc(r.forn)+'">'+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.forn)+'</a>':esc(r.forn))+'</div><small style="color:var(--mute)">'+esc(r.cod)+'</small></td>'
      +'<td><div class="trunc" title="'+esc(r.seg)+'">'+esc(r.seg)+'</div></td><td><div class="trunc" title="'+esc(r.doc)+'">'+esc(r.doc)+'</div></td>'
      +'<td>'+(r.obr?'Sim':'Não')+'</td><td class="nw">'+esc(r.etapa)+'</td><td>'+(r.arq?'Enviado':'—')+'</td><td class="nw">'+fmtData(r.venc)+'</td><td class="num nw">'+txtDias(r.dias)+'</td><td><span class="pill p-'+r.st+'">'+ST[r.st].l+'</span></td></tr>').join('')
    +'</tbody></table></div><div class="pg"><span>'+nf(S.page*PP+1)+'–'+nf(Math.min(rows.length,S.page*PP+PP))+' de '+nf(rows.length)+'</span><button data-a="pg" data-v="-1" '+(S.page===0?'disabled':'')+'>Anterior</button><button data-a="pg" data-v="1" '+(S.page>=pages-1?'disabled':'')+'>Próxima</button></div></div>';
  return h;
}
function exportarCsv(){
  const rows=filtrar(S.pend), q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['Fornecedor','Código','Segmento','Documento','Obrigatório','Etapa','Arquivo','Vencimento','Prazo (dias)','Situação','Link'];
  const out=[head.map(q).join(';')].concat(rows.map(r=>[r.forn,r.cod,r.seg,r.doc,r.obr?'Sim':'Não',r.etapa,r.arq?'Enviado':'',fmtData(r.venc)==='—'?'':fmtData(r.venc),r.dias==null?'':r.dias,ST[r.st].l,r.link].map(q).join(';')));
  const blob=new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='documentos_fornecedores_'+S.hoje.toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================ EVENTOS ============================ */
function irDetalhe(){S.tab='detalhe';S.page=0;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-x]')) return;
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v!=null? decodeURIComponent(el.dataset.v):'', f=S.f;
  if(a==='tab'){S.tab=v;S.page=0;render();window.scrollTo(0,0)}
  else if(a==='refresh') atualizar();
  else if(a==='clear'){f.obrig='sim';f.etapa='';f.seg='';f.doc='';f.q='';f.status=new Set();f.bucket='';S.page=0;document.getElementById('fQ').value='';montarFiltros();render()}
  else if(a==='bucket'){f.bucket=v;irDetalhe()}
  else if(a==='st'){f.status=new Set([v]);f.bucket='';irDetalhe()}
  else if(a.slice(0,3)==='st:'){f.status=new Set([a.slice(3)]);f.bucket='';irDetalhe()}
  else if(a==='crit'){f.status=new Set(['pendente','vencido']);f.bucket='';f.obrig='sim';montarFiltros();irDetalhe()}
  else if(a==='seg'){f.seg=v;f.status=new Set(['pendente','vencido','v30']);f.bucket='';montarFiltros();irDetalhe()}
  else if(a==='doc'){f.doc=v;f.status=new Set(['pendente','vencido','v30']);f.bucket='';irDetalhe()}
  else if(a==='fq'){f.q=v;document.getElementById('fQ').value=v;f.status=new Set();f.bucket='';irDetalhe()}
  else if(a==='stt'){f.status.has(v)?f.status.delete(v):f.status.add(v);S.page=0;render()}
  else if(a==='rm'){if(v==='doc')f.doc='';else if(v==='bucket')f.bucket='';else f.status.delete(v.slice(3));S.page=0;render()}
  else if(a==='sort'){S.sort=S.sort.k===v?{k:v,dir:-S.sort.dir}:{k:v,dir:1};render()}
  else if(a==='pg'){S.page+=+v;render();window.scrollTo(0,0)}
  else if(a==='stclear'){f.status=new Set();S.page=0;render()}
  else if(a==='csv') exportarCsv();
});
montarStatus();
document.getElementById('fStatusPanel').addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.st; if(!k) return;
  e.target.checked? S.f.status.add(k) : S.f.status.delete(k);
  S.page=0; render();
});
document.addEventListener('click',e=>{const d=document.getElementById('fStatus');if(d.open&&!d.contains(e.target))d.open=false});
document.getElementById('fObr').addEventListener('change',e=>{S.f.obrig=e.target.value;S.page=0;render()});
document.getElementById('fEtapa').addEventListener('change',e=>{S.f.etapa=e.target.value;S.page=0;render()});
document.getElementById('fSeg').addEventListener('change',e=>{S.f.seg=e.target.value;S.page=0;render()});
let tq;document.getElementById('fQ').addEventListener('input',e=>{clearTimeout(tq);tq=setTimeout(()=>{S.f.q=e.target.value;S.page=0;render()},220)});

let ultimaCarga=Date.now();
const _carregar=carregar;
carregar=function(m){ultimaCarga=Date.now();return _carregar(m)};
carregar(false);
/* Atualização automática (só quando há API_URL): relê a planilha a cada REFRESH_MIN minutos */
if(CONFIG.API_URL&&CONFIG.REFRESH_MIN>0){
  setInterval(()=>{if(!document.hidden&&!atualizando)carregar(false)},CONFIG.REFRESH_MIN*60000);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&Date.now()-ultimaCarga>CONFIG.REFRESH_MIN*60000)carregar(false);
  });
}
</script>
