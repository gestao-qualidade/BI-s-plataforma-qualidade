<script>

};

function tvEscala(){

  el.style.transform='translate('+Math.max(0,(innerWidth-1920*s)/2)+'px,'+Math.max(0,(innerHeight-1080*s)/2)+'px) scale('+s+')';

function tvSair(salvar){
  S.modo='normal'; document.body.classList.remove('tv');
  try{if(salvar!==false)localStorage.setItem(TVK,'normal'); if(document.fullscreenElement) document.exitFullscreen()}catch(e){}
}
function tvSetModo(m,salvar){
  if(m==='tv'){
    S.modo='tv'; document.body.classList.add('tv');
    const mn=document.getElementById('main'); if(mn) mn.innerHTML='';
    try{if(salvar!==false)localStorage.setItem(TVK,'tv')}catch(e){}
    try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
    tvRender();
  }else{ tvSair(salvar); _tvRenderBase(); window.scrollTo(0,0) }
}
const _tvRenderBase=render;
render=function(){ if(S.modo==='tv'){tvRender();return} return _tvRenderBase.apply(this,arguments) };

window.CBX_ESTADO={'data-f:*':true};
(function(){

  function criar(sel){

  function msConta(d){const p=d.querySelector('.msp'),c=p&&p.querySelector('.ms-f .cbx-c');if(!c)return;const n=p.querySelectorAll('input[type=checkbox]:checked').length;c.textContent=n?n+(n===1?' selecionado':' selecionados'):'Nenhum selecionado (mostra todos)'}

/* ===== dica ao passar o mouse (valores dos gráficos) ===== */
(function(){

 const SVG='http://www.w3.org/2000/svg',cl=s=>String(s||'').replace(/[ \t\r\f\v]+/g,' ').replace(/ *\n */g,'\n').trim();
