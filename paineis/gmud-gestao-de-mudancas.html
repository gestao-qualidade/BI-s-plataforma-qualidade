<header><div class="hd"><div><h1>Painel de GMUD e Oportunidades de Melhoria</h1><div class="sub">PierServ · Qualidade · planos de ação do Qualiex</div></div>

<nav role="tablist"><button role="tab" data-a="tab" data-v="geral">GMUDs (ocorrências)</button><button role="tab" data-a="tab" data-v="planos">Planos de ação das GMUDs</button><button role="tab" data-a="tab" data-v="gestao">Responsáveis e áreas</button><button role="tab" data-a="tab" data-v="dgmud">Detalhe das GMUDs</button><button role="tab" data-a="tab" data-v="dplano">Detalhe dos planos</button></nav>
<div class="farol" id="farol" aria-hidden="true"></div></header>
<div class="fb" id="fb"><div class="fbi">
<span id="fsel"></span>
<label>Término de<input type="date" data-f="de"></label><label>até<input type="date" data-f="ate"></label>
<label>Buscar<input type="search" data-f="q" placeholder="código, plano, responsável…"></label>
<button class="btn sec" data-a="clear" style="margin-left:auto">Limpar filtros</button></div></div>
<main id="main"><div class="empty">Carregando dados…</div></main><div class="toast" id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
/* ===== CONFIGURAÇÃO ===== */
const CONFIG={
  TIPOS_OCORRENCIA:['gmud','oportunidade de melhoria'], /* considera SOMENTE o campo "Tipo da ocorrência": GMUD e Oportunidade de Melhoria */

};
const DIA=864e5,HOJE=(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()})();
const SIT={atrasado:['Atrasado','--atrasado'],v7:['Vence em até 7 dias','--v7'],noprazo:['No prazo','--noprazo'],conc:['Concluído no prazo','--conc'],concatr:['Concluído com atraso','--concatr'],susp:['Suspenso','--susp'],canc:['Cancelado','--canc']};
const OS={atrasada:['Com plano atrasado','--atrasado'],v7:['Plano vence em até 7 dias','--v7'],andamento:['Em andamento no prazo','--noprazo'],pronta:['Pronta para encerrar','--pronta'],conc:['Concluída','--conc'],outras:['Cancelada / reprovada / associada','--canc']};
const ORD=Object.keys(SIT),OORD=Object.keys(OS),ST1={1:'Aguardando início',2:'Em execução',3:'Verificando eficácia',4:'Concluído',5:'Suspenso',6:'Cancelado'},ST2={0:'Aberta',8:'Concluída',1:'Cancelada',9:'Reprovada',17:'Associada'};
const FS=[['otipo','Tipo da ocorrência'],['cat','Categoria'],['ost','Status da ocorrência'],['oresp','Resp. da ocorrência'],['local','Local'],['resp','Resp. do plano'],['tipo','Tipo do plano']];
const S={all:[],gmN:0,tab:'geral',f:{},sp:{k:'s',dir:1},so:{k:'os',dir:1},page:0,info:'',mode:'',busy:false,soG:true,erro:'',vp:[],vo:[]};
const $=id=>document.getElementById(id),enc=encodeURIComponent;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n).toLocaleString('pt-BR'),brl=n=>'R$ '+Number(n).toLocaleString('pt-BR',{maximumFractionDigits:0});
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),pc=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const fmtD=t=>t?new Date(t).toLocaleDateString('pt-BR'):'—',mk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const lab=k=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+k.slice(5)-1]+'/'+k.slice(2,4);
const lk=(u,t)=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" title="Abrir no Qualiex">'+esc(t)+'</a>':esc(t);
const pk=r=>r.cod+'|'+r.ocod+'|'+r.nome;
function pd(v){if(v==null||v==='')return null;let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]).getTime();m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],m[2]-1,+m[1]).getTime():null}
const nm=v=>typeof v==='number'?v:(parseFloat(String(v||'').replace(/[R$\s.]/g,'').replace(',','.'))||0);
function sit(r){const s=norm(r.st);if(s.startsWith('cancel'))return'canc';if(s.startsWith('suspens'))return'susp';
 if(s.startsWith('conclu'))return(r.real&&r.fim&&r.real>r.fim)?'concatr':'conc';
 if(r.fim==null)return'noprazo';const d=Math.round((r.fim-HOJE)/DIA);return d<0?'atrasado':d<=7?'v7':'noprazo'}
function P(o){const r={cod:o.code||'',nome:o.name||'',pai:o.parent_name||'',resp:o.task_responsible_name||'—',ver:o.checker_name||'',local:o.place_name||o.place_of_occurrence||'—',olocal:o.place_of_occurrence||o.place_name||'',tipo:o.type_id||'—',ini:pd(o.start_date),fim:pd(o.end_date),real:pd(o.real_end_date),
 prog:Math.min(100,parseFloat(String(o.percent_progress).replace(',','.'))||0),est:nm(o.estimated_cost),rep:nm(o.total_reported_cost),st:ST1[o.id_status]||o.id_status||'',ocod:o.occurrence_code||'',otit:o.occurrence_title||'',ost:ST2[o.occurrence_id_status]||o.occurrence_id_status||'',
 link:o.occurrence_link||'',otipo:o.type_name_of_occurrence||'—',cat:o.category_name||'—',desc:o.description||'',just:o.justification||'',rdesc:o.last_report_progress_description||'',rdata:pd(o.last_report_progress_date),oresp:o.occurrence_responsible_name||'—'};
 r.s=sit(r);r.dias=r.fim==null?null:Math.round((r.fim-HOJE)/DIA);r.g=CONFIG.TIPOS_OCORRENCIA.indexOf(norm(r.otipo).trim())>=0;
 r.busca=norm([r.cod,r.nome,r.resp,r.local,r.ocod,r.otit,r.oresp,r.pai].join(' '));return r}
function setData(d){S.all=(d.rows||[]).map(P);S.gmN=S.all.filter(r=>r.g).length;S.info=d.atualizadoEm||'';S.erro='';fonte();montarFiltros();render()}
const base=()=>S.all.filter(r=>r.g);
function filtrar(rows,o){o=o||{};const f=S.f,q=norm(f.q),de=pd(f.de),ate=pd(f.ate);return rows.filter(r=>{
 for(const [k] of FS)if(f[k]&&r[k]!==f[k])return false;
 if(!o.semS&&f.s&&r.s!==f.s)return false;if(f.mes&&(!r.fim||mk(r.fim)!==f.mes))return false;
 if(de&&(!r.fim||r.fim<de))return false;if(ate&&(!r.fim||r.fim>ate))return false;if(q&&r.busca.indexOf(q)<0)return false;return true})}
function resumo(rows){const c={};ORD.forEach(k=>c[k]=0);let est=0,rep=0,ps=0;rows.forEach(r=>{c[r.s]++;est+=r.est;rep+=r.rep;if(r.s==='atrasado'||r.s==='v7'||r.s==='noprazo')ps+=r.prog});
 const ab=c.atrasado+c.v7+c.noprazo,conc=c.conc+c.concatr;return{n:rows.length,c,ab,conc,pz:conc?Math.round(c.conc/conc*100):null,est,rep,pm:ab?Math.round(ps/ab):0}}
function osit(o){const s=norm(o.st);if(s.startsWith('conclu'))return'conc';if(s&&!s.startsWith('abert'))return'outras';const c=o.R.c;
 if(c.atrasado)return'atrasada';if(c.v7)return'v7';if(c.noprazo)return'andamento';return o.cn?'pronta':'andamento'}
function ocorrencias(rows){const m={};rows.forEach(r=>{const k=r.ocod||('sem '+r.cod);const o=m[k]||(m[k]={cod:r.ocod||'—',tit:r.otit,st:r.ost,resp:r.oresp,tipo:r.otipo,cat:r.cat,local:r.olocal,link:r.link,pl:[]});o.pl.push(r)});
 return Object.values(m).map(o=>{const R=resumo(o.pl);o.R=R;o.n=o.pl.length;o.at=R.c.atrasado;o.cn=R.conc;
  const a=o.pl.filter(r=>r.s!=='susp'&&r.s!=='canc');o.pm=a.length?Math.round(a.reduce((x,r)=>x+r.prog,0)/a.length):0;
  const f=o.pl.map(r=>r.fim).filter(Boolean);o.fim=f.length?Math.max(...f):null;

 let h=S.erro?'<div class="err"><b>Não foi possível carregar:</b> '+esc(S.erro)+'</div>':'';
 if(!S.all.length){$('main').innerHTML=h+(S.erro?'':'<div class="empty">Nenhum dado na aba. Clique em “Atualizar do Qualiex”.</div>');return}
 if(!S.gmN)h+='<div class="err">Nenhum registro com Tipo da ocorrência “GMUD” ou “Oportunidade de Melhoria” foi encontrado.</div>';
 ['mes','omes'].forEach(k=>{if(S.f[k])h+='<div class="chip">Prazo em '+lab(S.f[k])+(k==='omes'?' (GMUDs)':' (planos)')+'<button data-a="rm" data-v="'+k+'" aria-label="Remover">×</button></div> '});
 $('main').innerHTML=h+(S.tab==='geral'?vGeral(r0):S.tab==='planos'?vPlanos(pr):S.tab==='gestao'?vGestao(pr,resumo(pr)):S.tab==='dgmud'?vDetOc(r0):vDetPlanos(pr,r0))}
/* ===== exportação ===== */
function baixar(nome,cab,linhas){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+[cab.map(q).join(';')].concat(linhas.map(l=>l.map(q).join(';'))).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=nome+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove()}
const D=t=>t?fmtD(t):'';
function csvP(){baixar('gmud_planos',['Cód. plano','Plano de ação','Pertence à','Responsável','Verificador','Local','Tipo do plano','Início','Término','Concluído em','Progresso %','Custo estimado','Custo reportado','Situação','Status Qualiex','Cód. ocorrência','Título da ocorrência','Status da ocorrência','Resp. da ocorrência','Tipo da ocorrência','Categoria','Link da ocorrência'],S.vp.map(r=>[r.cod,r.nome,r.pai,r.resp,r.ver,r.local,r.tipo,D(r.ini),D(r.fim),D(r.real),r.prog,r.est,r.rep,SIT[r.s][0],r.st,r.ocod,r.otit,r.ost,r.oresp,r.otipo,r.cat,r.link]))}
function csvO(){baixar('gmud_ocorrencias',['Cód. ocorrência','Título','Tipo','Categoria','Responsável','Status Qualiex','Local','Planos','Atrasados','Concluídos','Progresso médio %','Prazo final','Situação','Link'],S.vo.map(o=>[o.cod,o.tit,o.tipo,o.cat,o.resp,o.st,o.local,o.n,o.at,o.cn,o.pm,D(o.fim),OS[o.os][0],o.link]))}
/* ===== detalhe (modal) ===== */
const fld=(l,v,w)=>'<div'+(w?' class="w"':'')+'><small>'+l+'</small>'+(v?esc(v):'—')+'</div>';
function modal(t,b){const d=$('dlg');d.innerHTML='<div class="dh"><h3>'+t+'</h3><button data-a="close" aria-label="Fechar">×</button></div><div class="db">'+b+'</div>';if(!d.open)d.showModal();d.querySelector('.db').scrollTop=0}
function abrirPlano(r){if(!r)return;modal(esc(r.cod)+' · '+esc(r.nome),'<div class="w">'+pill(r.s)+' <span class="mut">'+esc(r.st)+' · '+prazo(r)+'</span></div>'
 +fld('Responsável',r.resp)+fld('Verificador',r.ver)+fld('Local',r.local)+fld('Tipo do plano',r.tipo)+fld('Início',fmtD(r.ini))+fld('Término',fmtD(r.fim))+fld('Concluído em',fmtD(r.real))+fld('Progresso',Math.round(r.prog)+'%')+fld('Custo estimado',brl(r.est))+fld('Custo reportado',brl(r.rep))
 +fld('Descrição',r.desc,1)+fld('Justificativa',r.just,1)+fld('Último andamento '+(r.rdata?'('+fmtD(r.rdata)+')':''),r.rdesc,1)
 +'<div class="w"><small>Ocorrência (GMUD)</small><b>'+lk(r.link,r.ocod)+'</b> · '+esc(r.otit)+' <span class="mut">('+esc(r.ost)+')</span><br><button class="btn sec" style="margin-top:8px" data-a="oc" data-v="'+enc(r.ocod)+'">Ver GMUD e todos os planos</button> '+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">Abrir no Qualiex</a>':'')+'</div>')}
function abrirOc(cod){const o=ocorrencias(S.all.filter(r=>r.ocod===cod))[0];if(!o)return;
 modal(lk(o.link,o.cod)+' · '+esc(o.tit),'<div class="w">'+opill(o.os)+' <span class="mut">'+esc(o.st)+' · prazo '+prazoO(o)+'</span></div>'+fld('Responsável pela ocorrência',o.resp)+fld('Local',o.local)+fld('Tipo',o.tipo)+fld('Categoria',o.cat)
 +fld('Planos de ação',o.n+' ('+o.cn+' concluídos, '+o.at+' atrasados)')+fld('Progresso médio',o.pm+'%')
 +'<div class="w">'+(o.link?'<a href="'+esc(o.link)+'" target="_blank" rel="noopener">Abrir ocorrência no Qualiex</a>':'')+'</div><div class="w"><small>Planos de ação desta GMUD</small><div class="tw"><table><thead><tr><th>Cód. plano</th><th>Plano</th><th>Responsável</th><th>Término</th><th>Prazo</th><th>Progresso</th><th>Situação</th></tr></thead><tbody>'
 +o.pl.slice().sort((a,b)=>VP.s(a)-VP.s(b)).map(r=>'<tr class="clk" data-a="row" data-v="'+enc(pk(r))+'"><td class="nw">'+esc(r.cod)+'</td><td>'+esc(r.nome)+'</td><td>'+esc(r.resp)+'</td><td class="nw">'+fmtD(r.fim)+'</td><td class="nw">'+prazo(r)+'</td><td class="nw">'+pbar(r.prog)+'</td><td>'+pill(r.s)+'</td></tr>').join('')+'</tbody></table></div></div>')}
/* ===== eventos ===== */
document.addEventListener('click',e=>{if(e.target.closest('a'))return;const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v!=null?decodeURIComponent(el.dataset.v):'',f=S.f,go=t=>{S.tab=t;S.page=0};
 if(a==='refresh'){atualizar();return}if(a==='csvp'){csvP();return}if(a==='csvo'){csvO();return}if(a==='close'){$('dlg').close();return}
 if(a==='row'){abrirPlano(S.all.find(r=>pk(r)===v));return}if(a==='oc'){abrirOc(v);return}
 if(a==='tab'){S.tab=v;S.page=0}else if(a==='clear'){S.f={};S.page=0;document.querySelectorAll('#fb input[data-f]').forEach(i=>i.value='')}
 else if(a==='s'){f.s=v||undefined;go('dplano')}else if(a==='os'){f.os=v||undefined;go('dgmud')}else if(a==='mes'){f.mes=v;go('dplano')}else if(a==='omes'){f.omes=v;go('dgmud')}
 else if(a==='f'){f[el.dataset.k]=v;go(el.dataset.t||'dplano')}else if(a==='rm'){delete f[v]}
 else if(a==='sort'){const o=el.dataset.t==='o'?'so':'sp';S[o]=S[o].k===v?{k:v,dir:-S[o].dir}:{k:v,dir:1}}else if(a==='pg'){S.page+=+v}
 montarFiltros();render();window.scrollTo(0,0)});
carregar();
</script></body></html>
