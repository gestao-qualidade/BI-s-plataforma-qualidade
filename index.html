<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de BI · PierServ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1F6B;--royal:#1747B8;--azure:#2F6BFF;--ink:#12203A;--mute:#6B7A93;--line:#DCE2EB;
  --ok:#0E8A7D;--venc:#C0304F;--v30:#E3A008}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#0A1F6B}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 500px at 15% 0%,rgba(80,140,255,.35),transparent 70%),
             radial-gradient(800px 500px at 100% 100%,rgba(20,60,190,.45),transparent 70%),
             linear-gradient(160deg,#041046,#0A2A9A 55%,#0B1E78),url("/fundo.jpg");
  background-blend-mode:normal,normal,normal,soft-light;background-size:cover}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.tela{display:none;min-height:100%}
.tela.on{display:flex}

/* ---------- login / troca de senha / avisos ---------- */
.auth{align-items:center;justify-content:center;padding:24px}
.acard{width:min(430px,100%);background:rgba(255,255,255,.97);border-radius:22px;padding:0 32px 30px;text-align:center;
  box-shadow:0 30px 70px -20px rgba(0,5,40,.8),inset 0 1px 0 #fff;overflow:hidden}
.acard .top{background:linear-gradient(135deg,#071a66,#1747B8 70%,#2F6BFF);margin:0 -32px 24px;padding:26px 20px 20px}
.acard .top img{height:92px;filter:drop-shadow(0 0 18px rgba(130,180,255,.55))}
.acard h1{margin:0 0 6px;font-size:22px;color:var(--navy)}
.acard p{margin:0 0 18px;color:var(--mute)}
.acard form{text-align:left}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid #CBD7EE;border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--royal);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
.pw{position:relative}
.pw input{padding-right:78px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--royal);font-weight:600;font-size:12px;padding:6px}
.btn-main{width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;color:#fff;margin-top:4px;
  background:linear-gradient(135deg,var(--royal),var(--azure));box-shadow:0 12px 24px -12px rgba(23,71,184,.9);transition:transform .15s}
.btn-main:hover{transform:translateY(-1px)}
.btn-main:disabled{opacity:.6;cursor:wait;transform:none}
.msg{margin-top:12px;font-size:13px;color:var(--venc);min-height:18px;text-align:center}
.msg.ok{color:var(--ok)}
.dica{font-size:12px;color:var(--mute);margin:-6px 0 12px}
.lnk{background:none;border:0;color:var(--royal);font-weight:600;padding:8px}
.cfg code{background:#EEF3FC;padding:2px 6px;border-radius:6px;font-size:12px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- aplicativo e sidebar retrátil ---------- */
#tApp{height:100%}
aside{
  width:272px;
  flex:none;
  display:flex;
  flex-direction:column;
  color:#fff;
  background:linear-gradient(180deg,rgba(3,10,52,.94),rgba(8,30,110,.9));
  border-right:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  transition:width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  overflow:hidden;
  position:relative;
  z-index: 20;
}

/* Estado Recolhido da Sidebar */
aside.collapsed {
  width: 68px;
}
aside.collapsed:hover {
  width: 272px;
  box-shadow: 10px 0 30px rgba(0,0,0,0.5);
}

.sb-top{padding:16px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.sb-brand{display:flex;flex-direction:column;align-items:center;flex:1;overflow:hidden;transition:opacity 0.2s}
.sb-top img{height:60px;filter:drop-shadow(0 0 18px rgba(130,180,255,.5))}
.sb-tag{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#9DB5E8;margin-top:4px;white-space:nowrap}

/* Botão Toggle de encolher/expandir o menu */
.btn-toggle-sb {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  flex: none;
  transition: background 0.15s, transform 0.25s;
}
.btn-toggle-sb:hover { background: rgba(255, 255, 255, 0.25); }
aside.collapsed .btn-toggle-sb { transform: rotate(180deg); }

aside.collapsed:not(:hover) .sb-brand { display: none; }
aside.collapsed:not(:hover) .sb-top { justify-content: center; padding: 16px 0 12px; }

.menu{padding:8px 10px;flex:1;overflow-y:auto;overflow-x:hidden}
.sec{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#8FA6DD;padding:16px 10px 6px;white-space:nowrap}
aside.collapsed:not(:hover) .sec { opacity: 0; padding: 8px 0; }

.mi{
  display:flex;
  gap:12px;
  align-items:center;
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:0;
  background:transparent;
  color:#DCE7FC;
  font-weight:500;
  text-align:left;
  transition:background .15s;
  white-space:nowrap;
}
.mi:hover{background:rgba(255,255,255,.09)}
.mi.on{background:linear-gradient(135deg,#fff,#DDE8FF);color:var(--navy);font-weight:600;box-shadow:0 8px 20px -10px rgba(0,8,50,.8)}
.mi svg{width:20px;height:20px;flex:none}
.mi span{overflow:hidden;text-overflow:ellipsis}
aside.collapsed:not(:hover) .mi span { display: none; }

.vazio-menu{padding:8px 12px;color:#9DB5E8;font-size:13px;white-space:nowrap}
aside.collapsed:not(:hover) .vazio-menu { display: none; }

.sb-user{border-top:1px solid rgba(255,255,255,.14);padding:12px;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,#2F6BFF,#79B0FF);color:#fff;font-weight:700;display:grid;place-items:center}
.sb-user .n{min-width:0;flex:1;white-space:nowrap}
.sb-user .n b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .n small{color:#9DB5E8;font-size:11px}
aside.collapsed:not(:hover) .sb-user .n,
aside.collapsed:not(:hover) .sb-user .mini { display: none; }
aside.collapsed:not(:hover) .sb-user { justify-content: center; padding: 12px 0; }

.mini{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 9px;font-size:12px}
.mini:hover{background:rgba(255,255,255,.18)}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:none;align-items:center;gap:12px;padding:10px 14px;background:rgba(3,10,52,.92);color:#fff}
.top button{background:none;border:0;color:#fff;font-size:24px;line-height:1}
.view{flex:1;overflow:auto;display:none}
.view.on{display:block}
#frm{flex:1;width:100%;border:0;display:none}
#frm.on{display:block}

.pg{max-width:1180px;margin:0 auto;padding:30px 28px 50px}
.pg h1{margin:0;color:#fff;font-size:26px;text-shadow:0 2px 14px rgba(0,8,50,.5)}
.pg .sub{color:#B9CCF5;margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{text-align:left;border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:20px;color:var(--ink);position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(241,246,255,.96));box-shadow:0 18px 40px -20px rgba(2,10,50,.85);
  transition:transform .18s,box-shadow .18s}
.pc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--azure),#79B0FF 55%,transparent)}
.pc:hover{transform:translateY(-3px);box-shadow:0 24px 44px -18px rgba(2,10,50,.9)}
.pc .ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:12px;
  background:linear-gradient(135deg,var(--navy),var(--azure));box-shadow:0 10px 20px -10px rgba(23,71,184,.9)}
.pc .ib svg{width:24px;height:24px}
.pc h3{margin:0 0 4px;color:var(--navy);font-size:16px}
.pc p{margin:0;color:var(--mute);font-size:13px}
.vazio{background:rgba(255,255,255,.96);border-radius:18px;padding:28px;text-align:center;color:var(--mute)}
.box{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(241,246,255,.96));border:1px solid rgba(255,255,255,.7);border-radius:18px;
  padding:22px;box-shadow:0 18px 40px -20px rgba(2,10,50,.85)}
.box h2{margin:0 0 14px;font-size:17px;color:var(--navy)}
.box.estreito{max-width:440px}

/* ---------- administração ---------- */
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));color:#fff;
  border-radius:99px;padding:7px 15px;font-weight:500}
.tab.on{background:linear-gradient(180deg,#fff,#DDE8FF);color:var(--navy);font-weight:600}
.tab b{margin-left:6px;opacity:.85}
.busca{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.95);border-radius:99px;padding:8px 16px;min-width:220px}
.novo{border:0;border-radius:99px;padding:9px 18px;font-weight:700;color:var(--navy);background:linear-gradient(180deg,#fff,#DDE8FF);box-shadow:0 8px 20px -10px rgba(0,8,50,.8)}
.frm-novo{margin-bottom:16px;display:none}
.frm-novo.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.rowpw{display:flex;gap:8px}
.rowpw input{flex:1;min-width:0}
.btn-s{border:0;border-radius:10px;padding:0 13px;font-weight:600;font-size:13px;background:#EEF3FC;color:var(--navy);white-space:nowrap}
.cred{display:none;margin-bottom:16px;border:2px solid var(--ok);background:#F0FBF8;border-radius:16px;padding:16px 18px}
.cred.on{display:block}
.cred h3{margin:0 0 6px;color:#0A6F64;font-size:15px}
.cred pre{margin:8px 0 12px;background:#fff;border:1px solid #CFEAE4;border-radius:10px;padding:10px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.cred small{color:#2c6c64}
.u{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(241,246,255,.96));border:1px solid rgba(255,255,255,.7);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;box-shadow:0 14px 30px -20px rgba(2,10,50,.9);
  display:grid;grid-template-columns:minmax(250px,1.5fr) 120px 118px minmax(180px,2fr) auto;gap:14px;align-items:center}
.ui{display:flex;gap:12px;align-items:center;min-width:0}
.ui .t{min-width:0}
.ui b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;text-align:center}
.st-ativo{background:#D8F3EE;color:#0A6F64}.st-bloqueado{background:#E3E6EE;color:#3A4660}
.tag{display:block;margin-top:4px;font-size:11px;color:#8A5B00}
.u select{border:1px solid #CBD7EE;border-radius:10px;padding:6px 8px;background:#fff;width:100%}
.u select:disabled{background:#F1F4FA;color:var(--mute)}
.pn{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid #CBD7EE;border-radius:99px;padding:4px 11px;font-size:12px;background:#fff;cursor:pointer;user-select:none}
.chk input{accent-color:var
