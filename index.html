<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de BI - PierServ</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 70px;
      --primary-color: #1e293b;
      --accent-color: #2563eb;
      --bg-light: #f8fafc;
      --text-color: #f1f5f9;
      --transition-speed: 0.3s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-light);
      overflow: hidden;
    }

    /* --- SIDEBAR INTEGRADA --- */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background-color: var(--primary-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 1000;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }

    /* Estado Recolhido da Sidebar */
    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    /* Oculta textos e elementos quando recolhido */
    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .menu-text,
    .sidebar.collapsed .user-info {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Efeito Hover Intuitivo: expande ao passar o mouse quando recolhida */
    .sidebar.collapsed:hover {
      width: var(--sidebar-width);
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
    }

    .sidebar.collapsed:hover .sidebar-title,
    .sidebar.collapsed:hover .menu-text,
    .sidebar.collapsed:hover .user-info {
      opacity: 1;
      visibility: visible;
    }

    /* Cabeçalho da Sidebar */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: opacity var(--transition-speed);
      color: #ffffff;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background var(--transition-speed);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Menu de Navegação */
    .sidebar-menu {
      list-style: none;
      padding: 15px 0;
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-menu-item {
      display: flex;
      align-items: center;
      padding: 14px 22px;
      color: #94a3b8;
      text-decoration: none;
      gap: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sidebar-menu-item:hover,
    .sidebar-menu-item.active {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-left: 4px solid var(--accent-color);
    }

    .sidebar-menu-item i {
      font-size: 1.2rem;
      min-width: 24px;
      text-align: center;
    }

    .menu-text {
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity var(--transition-speed);
    }

    /* Área Principal (Iframe / Conteúdo) */
    .main-wrapper {
      flex: 1;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">PierServ BI</span>
      <button id="toggleSidebarBtn" class="toggle-btn" onclick="toggleSidebar()" title="Recolher/Expandir Menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <nav class="sidebar-menu">
      <a href="documentos-regulatorios.html" target="contentFrame" class="sidebar-menu-item active">
        <i class="fas fa-file-contract"></i>
        <span class="menu-text">Documentos Regulatórios</span>
      </a>
      <a href="#" class="sidebar-menu-item">
        <i class="fas fa-chart-pie"></i>
        <span class="menu-text">Indicadores</span>
      </a>
      <a href="#" class="sidebar-menu-item">
        <i class="fas fa-folder-open"></i>
        <span class="menu-text">Arquivos</span>
      </a>
      <a href="#" class="sidebar-menu-item">
        <i class="fas fa-cog"></i>
        <span class="menu-text">Configurações</span>
      </a>
    </nav>
  </aside>

  <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
  <main class="main-wrapper">
    <!-- Aponta diretamente para o relatório de documentos -->
    <iframe name="contentFrame" src="documentos-regulatorios.html"></iframe>
  </main>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      
      // Armazena a preferência do usuário no navegador
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('sidebar_collapsed', isCollapsed);
    }

    // Mantém o estado escolhido após o recarregamento
    document.addEventListener('DOMContentLoaded', () => {
      const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
      if (isCollapsed) {
        document.getElementById('sidebar').classList.add('collapsed');
      }
    });
  </script>

</body>
</html>
