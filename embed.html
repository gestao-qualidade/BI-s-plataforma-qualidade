<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:14px/1.5 system-ui,sans-serif}
#c{position:absolute;inset:0;overflow:hidden}
#f{position:absolute;left:0;top:0;width:100%;height:100%;border:0;transform-origin:0 0;background:transparent}
#m{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#5B6B86}
#m.on{display:flex}
</style>
<script src="/config.js"></script>
</head>
<body>
<div id="c"><iframe id="f" title="Painel" scrolling="auto"></iframe></div>
<div id="m"></div>
<script>
/* Parâmetros do link: t=token  zoom=30..150  bg=transparent|RRGGBB  raio=0..60  rolar=1  vel=px/s */
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get('t') || '';
const API = (window.PLATAFORMA && window.PLATAFORMA.API_URL) || '';
const num = (k, d, a, b) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? Math.min(b, Math.max(a, v)) : d; };
const ZOOM = num('zoom', 100, 30, 150) / 100, RAIO = num('raio', 0, 0, 60), VEL = num('vel', 40, 5, 400);
const ROLAR = Q.get('rolar') === '1';
const BG = Q.get('bg') === 'transparent' ? 'transparent' : (/^[0-9a-f]{6}$/i.test(Q.get('bg') || '') ? '#' + Q.get('bg') : '');
const $ = id => document.getElementById(id);

async function chamar(op) {
  let r;
  try {
    r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'embed', token: TOKEN, op: op }) });
  } catch (e) { throw new Error('Sem conexão com o servidor.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('O servidor respondeu algo inesperado.'); }
  if (!j.ok) throw new Error(j.erro || 'Erro');
  return j;
}

/* O painel (dentro do iframe) pede os dados aqui, como faz na plataforma. Só leitura. */
window.BI = {
  dados: async (painel, op) => {
    if (op) throw new Error('Esta ação não está disponível no painel incorporado.');
    return (await chamar('dados')).dados;
  }
};

function aviso(t) { $('c').style.display = 'none'; $('m').textContent = t; $('m').classList.add('on'); }

function rolagem() {
  let t = 0, ult = performance.now();
  (function passo(agora) {
    t += (agora - ult) / 1000; ult = agora;
    try {
      const d = $('f').contentDocument, el = d && (d.scrollingElement || d.documentElement);
      if (el) {
        d.documentElement.style.scrollBehavior = 'auto';
        const max = el.scrollHeight - el.clientHeight;
        if (max > 4) {
          const T = max / VEL, x = t % (2 * T + 8);
          let p;
          if (x < 3) p = 0;
          else if (x < 3 + T) p = (x - 3) / T;
          else if (x < 7 + T) p = 1;
          else if (x < 7 + 2 * T) p = 1 - (x - 7 - T) / T;
          else p = 0;
          el.scrollTop = p * max;
        }
      }
    } catch (e) { /* ignora */ }
    requestAnimationFrame(passo);
  })(ult);
}

(async () => {
  try {
    if (!TOKEN || !API) throw new Error('Link de incorporação incompleto.');
    const j = await chamar('info');
    document.title = j.painel.nome;
    const f = $('f');
    f.style.width = (100 / ZOOM) + '%';
    f.style.height = (100 / ZOOM) + '%';
    f.style.transform = 'scale(' + ZOOM + ')';
    $('c').style.borderRadius = RAIO + 'px';
    if (BG) { $('c').style.background = BG; }
    f.src = j.painel.pagina + (j.painel.pagina.includes('?') ? '&' : '?') + 'embed=1&_t=' + Date.now();
    if (ROLAR) rolagem();
  } catch (e) { aviso(e.message); }
})();
</script>
</body>
</html>
